<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SD Erandio - Panel Wellness</title>

  <link
    rel="stylesheet"
    href="estilos.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    /* =========================================================
       GENERAL
       ========================================================= */

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1e293b
        );

      padding:
        30px 15px;

      color:
        #1e293b;

      box-sizing:
        border-box;

    }


    *,
    *::before,
    *::after {

      box-sizing:
        border-box;

    }


    /* =========================================================
       CONTENEDOR
       ========================================================= */

    .contenedor {

      width:
        100%;

      max-width:
        1400px;

      margin:
        0 auto;

      background:
        white;

      padding:
        32px;

      border-radius:
        22px;

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.30);

      overflow:
        hidden;

    }


    /* =========================================================
       CABECERA
       ========================================================= */

    .cabecera {

      text-align:
        center;

      margin-bottom:
        28px;

    }


    .cabecera h1 {

      margin:
        0;

      font-size:
        36px;

      font-weight:
        800;

      letter-spacing:
        -0.5px;

      color:
        #0f172a;

    }


    .cabecera p {

      margin:
        8px 0 0;

      color:
        #64748b;

      font-size:
        16px;

    }


    /* =========================================================
       FILTROS
       ========================================================= */

    .filtros {

      display:
        flex;

      gap:
        15px;

      align-items:
        end;

      flex-wrap:
        wrap;

      margin-bottom:
        25px;

      padding:
        22px;

      background:
        #f8fafc;

      border:
        2px solid #e2e8f0;

      border-radius:
        16px;

      width:
        100%;

      min-width:
        0;

    }


    .campo {

      display:
        flex;

      flex-direction:
        column;

      gap:
        6px;

      min-width:
        0;

    }


    .campo label {

      font-weight:
        700;

      font-size:
        14px;

      color:
        #334155;

    }


    .campo select,
    .campo input {

      padding:
        13px 14px;

      border:
        2px solid #e2e8f0;

      border-radius:
        12px;

      font-size:
        15px;

      background:
        white;

      color:
        #1e293b;

      transition:
        all 0.2s ease;

      min-width:
        0;

      max-width:
        100%;

    }


    .campo select:focus,
    .campo input:focus {

      outline:
        none;

      border-color:
        #0f172a;

      box-shadow:
        0 0 0 3px
        rgba(15, 23, 42, 0.08);

    }


    /* =========================================================
       BOTÓN CONSULTAR
       ========================================================= */

    .boton-consultar {

      padding:
        13px 22px;

      border:
        none;

      border-radius:
        12px;

      background:
        #0f172a;

      color:
        white;

      font-size:
        15px;

      font-weight:
        700;

      cursor:
        pointer;

      transition:
        all 0.2s ease;

      box-shadow:
        0 6px 15px
        rgba(15, 23, 42, 0.18);

      min-width:
        0;

    }


    .boton-consultar:hover {

      background:
        #1e293b;

      transform:
        translateY(-2px);

      box-shadow:
        0 9px 20px
        rgba(15, 23, 42, 0.23);

    }


    /* =========================================================
       BOTÓN VOLVER
       ========================================================= */

    .boton-volver {

      display:
        block;

      margin:
        25px auto 0;

      padding:
        11px 18px;

      border:
        2px solid #334155;

      border-radius:
        12px;

      background:
        transparent;

      color:
        #334155;

      font-size:
        15px;

      font-weight:
        700;

      cursor:
        pointer;

      transition:
        0.2s;

    }


    .boton-volver:hover {

      background:
        #0f172a;

      color:
        white;

      transform:
        translateY(-2px);

    }


    /* =========================================================
       INFORMACIÓN
       ========================================================= */

    .info {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        15px;

      margin-bottom:
        15px;

      flex-wrap:
        wrap;

    }


    .contador {

      font-weight:
        700;

      color:
        #334155;

      font-size:
        15px;

    }


    /* =========================================================
       MENSAJES
       ========================================================= */

    .mensaje {

      padding:
        15px 18px;

      border-radius:
        12px;

      background:
        #f8fafc;

      border:
        2px solid #e2e8f0;

      color:
        #475569;

      margin-bottom:
        15px;

      display:
        none;

    }


    .mensaje.error {

      background:
        #fef2f2;

      border-color:
        #fecaca;

      color:
        #b91c1c;

    }


    /* =========================================================
       CONTENEDOR TABLA
       ========================================================= */

    .tabla-contenedor {

      display:
        none;

      width:
        100%;

      max-width:
        100%;

      overflow-x:
        auto;

      overflow-y:
        visible;

      border:
        2px solid #e2e8f0;

      border-radius:
        16px;

      box-shadow:
        0 8px 20px
        rgba(15, 23, 42, 0.08);

      background:
        white;

      -webkit-overflow-scrolling:
        touch;

    }


    /* =========================================================
       TABLA WELLNESS - ORDENADOR
       ========================================================= */

    .tabla-contenedor table {

      width:
        1160px;

      min-width:
        1160px;

      max-width:
        none;

      border-collapse:
        collapse;

      border-spacing:
        0;

      table-layout:
        fixed;

      background:
        white;

    }


    /* =========================================================
       CABECERA TABLA
       ========================================================= */

    .tabla-contenedor thead th {

      background:
        #0f172a;

      color:
        white;

      padding:
        14px 10px;

      font-size:
        14px;

      font-weight:
        700;

      text-align:
        center;

      white-space:
        nowrap;

      position:
        sticky;

      top:
        0;

      z-index:
        4;

      border:
        1px solid #334155;

      box-sizing:
        border-box;

    }


    /* =========================================================
       CELDAS
       ========================================================= */

    .tabla-contenedor tbody td {

      padding:
        12px 10px;

      border-bottom:
        1px solid #e2e8f0;

      border-right:
        1px solid #e2e8f0;

      text-align:
        center;

      font-size:
        14px;

      color:
        #334155;

      vertical-align:
        middle;

      box-sizing:
        border-box;

    }


    .tabla-contenedor tbody tr:hover {

      background:
        #f8fafc;

    }


    /* =========================================================
       COLUMNA JUGADOR - ORDENADOR
       ========================================================= */

    .tabla-contenedor th:nth-child(1),
    .tabla-contenedor td:nth-child(1) {

      width:
        250px;

      min-width:
        250px;

      max-width:
        250px;

    }


    .tabla-contenedor thead th:nth-child(1) {

      text-align:
        left;

      background:
        #222;

      position:
        sticky;

      left:
        0;

      z-index:
        6;

    }


    .tabla-contenedor tbody td:nth-child(1) {

      text-align:
        left;

      background:
        #f8fafc;

      font-weight:
        700;

      color:
        #0f172a;

      white-space:
        nowrap;

      overflow:
        hidden;

      text-overflow:
        ellipsis;

      position:
        sticky;

      left:
        0;

      z-index:
        5;

    }


    /* =========================================================
       SUEÑO
       ========================================================= */

    .tabla-contenedor th:nth-child(2),
    .tabla-contenedor td:nth-child(2) {

      width:
        90px;

      min-width:
        90px;

      max-width:
        90px;

    }


    /* =========================================================
       FATIGA
       ========================================================= */

    .tabla-contenedor th:nth-child(3),
    .tabla-contenedor td:nth-child(3) {

      width:
        90px;

      min-width:
        90px;

      max-width:
        90px;

    }


    /* =========================================================
       ESTRÉS
       ========================================================= */

    .tabla-contenedor th:nth-child(4),
    .tabla-contenedor td:nth-child(4) {

      width:
        90px;

      min-width:
        90px;

      max-width:
        90px;

    }


    /* =========================================================
       DOLOR
       ========================================================= */

    .tabla-contenedor th:nth-child(5),
    .tabla-contenedor td:nth-child(5) {

      width:
        90px;

      min-width:
        90px;

      max-width:
        90px;

    }


    /* =========================================================
       MOLESTIAS
       ========================================================= */

    .tabla-contenedor th:nth-child(6),
    .tabla-contenedor td:nth-child(6) {

      width:
        100px;

      min-width:
        100px;

      max-width:
        100px;

    }


    /* =========================================================
       COMENTARIO
       ========================================================= */

    .tabla-contenedor th:nth-child(7),
    .tabla-contenedor td:nth-child(7) {

      width:
        450px;

      min-width:
        450px;

      max-width:
        450px;

      text-align:
        left !important;

      vertical-align:
        top;

      white-space:
        normal !important;

      overflow:
        hidden;

      overflow-wrap:
        anywhere !important;

      word-break:
        break-word !important;

      line-height:
        1.5;

      padding:
        12px 10px;

      box-sizing:
        border-box;

    }


    .tabla-contenedor td:nth-child(7) {

      height:
        auto;

    }


    /* =========================================================
       VALORES
       ========================================================= */

    .valor {

      display:
        inline-flex;

      justify-content:
        center;

      align-items:
        center;

      min-width:
        32px;

      height:
        32px;

      padding:
        0 7px;

      border-radius:
        6px;

      font-weight:
        bold;

    }


    /* =========================================================
       ESCALA DE COLORES
       ========================================================= */

    .sueno-1,
    .riesgo-1 {

      background:
        #ff4d4d;

      color:
        white;

    }


    .sueno-2,
    .riesgo-2 {

      background:
        #ff9999;

      color:
        #7a0000;

    }


    .sueno-3,
    .riesgo-3 {

      background:
        #ffd966;

      color:
        #665000;

    }


    .sueno-4,
    .riesgo-4 {

      background:
        #a9df9c;

      color:
        #205c18;

    }


    .sueno-5,
    .riesgo-5 {

      background:
        #4caf50;

      color:
        white;

    }


    /* =========================================================
       MOLESTIAS
       ========================================================= */

    .molestias-si {

      background:
        #ff4d4d;

      color:
        white;

      font-weight:
        bold;

      padding:
        6px 10px;

      border-radius:
        6px;

    }


    .molestias-no {

      background:
        #4caf50;

      color:
        white;

      font-weight:
        bold;

      padding:
        6px 10px;

      border-radius:
        6px;

    }


    /* =========================================================
       SIN RESPUESTA
       ========================================================= */

    .sin-respuesta {

      color:
        #aaa;

      font-weight:
        normal;

    }


    /* =========================================================
       CARGANDO
       ========================================================= */

    .cargando {

      text-align:
        center !important;

      padding:
        30px !important;

      color:
        #666;

      white-space:
        normal !important;

    }


    /* =========================================================
       MÓVIL
       ========================================================= */

    @media (max-width: 700px) {


      /* -------------------------------------------------------
         BODY
         ------------------------------------------------------- */

      body {

        padding:
          10px 6px;

        overflow-x:
          hidden;

      }


      /* -------------------------------------------------------
         CONTENEDOR
         ------------------------------------------------------- */

      .contenedor {

        width:
          100%;

        max-width:
          100%;

        margin:
          0 auto;

        padding:
          18px 12px;

        border-radius:
          16px;

        overflow:
          hidden;

      }


      /* -------------------------------------------------------
         CABECERA
         ------------------------------------------------------- */

      .cabecera {

        margin-bottom:
          18px;

      }


      .cabecera h1 {

        font-size:
          26px;

      }


      .cabecera p {

        font-size:
          13px;

        line-height:
          1.45;

      }


      /* -------------------------------------------------------
         FILTROS
         ------------------------------------------------------- */

      .filtros {

        width:
          100%;

        max-width:
          100%;

        display:
          flex;

        flex-direction:
          column;

        align-items:
          stretch;

        gap:
          12px;

        padding:
          14px;

        margin-bottom:
          20px;

        overflow:
          hidden;

      }


      .campo {

        width:
          100%;

        max-width:
          100%;

        min-width:
          0;

      }


      .campo label {

        font-size:
          14px;

      }


      .campo select,
      .campo input {

        display:
          block;

        width:
          100%;

        max-width:
          100%;

        min-width:
          0;

        height:
          48px;

        padding:
          10px 12px;

        font-size:
          15px;

      }


      /* -------------------------------------------------------
         CORRECCIÓN ESPECÍFICA DEL CAMPO FECHA
         ------------------------------------------------------- */

      #fecha {

        width:
          100%;

        max-width:
          100%;

        min-width:
          0;

        display:
          block;

      }


      /* -------------------------------------------------------
         BOTÓN CONSULTAR
         ------------------------------------------------------- */

      .boton-consultar {

        width:
          100%;

        max-width:
          100%;

        min-width:
          0;

        height:
          48px;

        margin-top:
          3px;

        padding:
          10px 15px;

      }


      /* -------------------------------------------------------
         INFORMACIÓN
         ------------------------------------------------------- */

      .info {

        margin-bottom:
          12px;

      }


      .contador {

        font-size:
          14px;

      }


      /* -------------------------------------------------------
         TABLA
         ------------------------------------------------------- */

      .tabla-contenedor {

        width:
          100%;

        max-width:
          100%;

        overflow-x:
          hidden;

        overflow-y:
          visible;

        border-radius:
          10px;

      }


      /* =======================================================
         TABLA RESPONSIVE
         ======================================================= */

      .tabla-contenedor table {

        width:
          100%;

        min-width:
          100%;

        max-width:
          100%;

        table-layout:
          fixed;

      }


      /* -------------------------------------------------------
         CABECERA
         ------------------------------------------------------- */

      .tabla-contenedor thead th {

        padding:
          10px 3px;

        font-size:
          11px;

        white-space:
          normal;

        line-height:
          1.15;

      }


      /* -------------------------------------------------------
         CELDAS
         ------------------------------------------------------- */

      .tabla-contenedor tbody td {

        padding:
          9px 3px;

        font-size:
          12px;

      }


      /* =======================================================
         JUGADOR - AHORA SOLO 26%
         ======================================================= */

      .tabla-contenedor th:nth-child(1),
      .tabla-contenedor td:nth-child(1) {

        width:
          26%;

        min-width:
          0;

        max-width:
          none;

      }


      .tabla-contenedor thead th:nth-child(1) {

        position:
          sticky;

        left:
          0;

        z-index:
          6;

        text-align:
          left;

        padding-left:
          8px;

      }


      .tabla-contenedor tbody td:nth-child(1) {

        position:
          sticky;

        left:
          0;

        z-index:
          5;

        text-align:
          left;

        padding-left:
          8px;

        padding-right:
          4px;

        white-space:
          normal;

        overflow:
          hidden;

        text-overflow:
          clip;

        overflow-wrap:
          anywhere;

        word-break:
          break-word;

        line-height:
          1.2;

      }


      /* =======================================================
         SUEÑO - 9%
         ======================================================= */

      .tabla-contenedor th:nth-child(2),
      .tabla-contenedor td:nth-child(2) {

        width:
          9%;

        min-width:
          0;

        max-width:
          none;

      }


      /* =======================================================
         FATIGA - 9%
         ======================================================= */

      .tabla-contenedor th:nth-child(3),
      .tabla-contenedor td:nth-child(3) {

        width:
          9%;

        min-width:
          0;

        max-width:
          none;

      }


      /* =======================================================
         ESTRÉS - 9%
         ======================================================= */

      .tabla-contenedor th:nth-child(4),
      .tabla-contenedor td:nth-child(4) {

        width:
          9%;

        min-width:
          0;

        max-width:
          none;

      }


      /* =======================================================
         DOLOR - 9%
         ======================================================= */

      .tabla-contenedor th:nth-child(5),
      .tabla-contenedor td:nth-child(5) {

        width:
          9%;

        min-width:
          0;

        max-width:
          none;

      }


      /* =======================================================
         MOLESTIAS - 14%
         ======================================================= */

      .tabla-contenedor th:nth-child(6),
      .tabla-contenedor td:nth-child(6) {

        width:
          14%;

        min-width:
          0;

        max-width:
          none;

      }


      /* =======================================================
         COMENTARIO - 24%
         ======================================================= */

      .tabla-contenedor th:nth-child(7),
      .tabla-contenedor td:nth-child(7) {

        width:
          24%;

        min-width:
          0;

        max-width:
          none;

        padding:
          9px 4px;

        font-size:
          11px;

        text-align:
          left !important;

        white-space:
          normal !important;

        overflow:
          hidden;

        overflow-wrap:
          anywhere !important;

        word-break:
          break-word !important;

        line-height:
          1.3;

      }


      /* -------------------------------------------------------
         VALORES EN MÓVIL
         ------------------------------------------------------- */

      .valor {

        min-width:
          25px;

        width:
          25px;

        height:
          25px;

        padding:
          0;

        border-radius:
          5px;

        font-size:
          12px;

      }


      /* -------------------------------------------------------
         MOLESTIAS EN MÓVIL
         ------------------------------------------------------- */

      .molestias-si,
      .molestias-no {

        display:
          inline-flex;

        justify-content:
          center;

        align-items:
          center;

        min-width:
          25px;

        height:
          25px;

        padding:
          0 3px;

        border-radius:
          5px;

        font-size:
          10px;

      }


      /* -------------------------------------------------------
         BOTÓN VOLVER
         ------------------------------------------------------- */

      .boton-volver {

        width:
          100%;

        max-width:
          250px;

        margin-top:
          18px;

      }

    }


    /* =========================================================
       MÓVILES MUY PEQUEÑOS
       ========================================================= */

    @media (max-width: 380px) {


      .contenedor {

        padding:
          15px 8px;

      }


      .filtros {

        padding:
          12px;

      }


      .tabla-contenedor thead th {

        font-size:
          10px;

        padding:
          9px 2px;

      }


      .tabla-contenedor tbody td {

        font-size:
          11px;

        padding:
          8px 2px;

      }


      .tabla-contenedor th:nth-child(1),
      .tabla-contenedor td:nth-child(1) {

        width:
          25%;

      }


      .tabla-contenedor th:nth-child(2),
      .tabla-contenedor td:nth-child(2),
      .tabla-contenedor th:nth-child(3),
      .tabla-contenedor td:nth-child(3),
      .tabla-contenedor th:nth-child(4),
      .tabla-contenedor td:nth-child(4),
      .tabla-contenedor th:nth-child(5),
      .tabla-contenedor td:nth-child(5) {

        width:
          9%;

      }


      .tabla-contenedor th:nth-child(6),
      .tabla-contenedor td:nth-child(6) {

        width:
          14%;

      }


      .tabla-contenedor th:nth-child(7),
      .tabla-contenedor td:nth-child(7) {

        width:
          29%;

      }


      .valor {

        min-width:
          23px;

        width:
          23px;

        height:
          23px;

        font-size:
          11px;

      }


      .molestias-si,
      .molestias-no {

        min-width:
          23px;

        height:
          23px;

        font-size:
          9px;

      }

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <!-- =======================================================
         CABECERA
         ======================================================= -->

    <div class="cabecera">

      <h1>
        Panel Wellness
      </h1>

      <p>
        Consulta las respuestas Wellness de los jugadores por equipo y día.
      </p>

    </div>


    <!-- =======================================================
         FILTROS
         ======================================================= -->

    <div class="filtros">


      <div class="campo">

        <label for="equipo">
          Equipo
        </label>

        <select id="equipo">

          <option value="">
            Cargando equipos...
          </option>

        </select>

      </div>


      <div class="campo">

        <label for="fecha">
          Día
        </label>

        <input
          type="date"
          id="fecha"
        >

      </div>


      <button
        type="button"
        class="boton-consultar"
        onclick="consultarWellness()"
      >
        CONSULTAR
      </button>


    </div>


    <!-- =======================================================
         MENSAJE
         ======================================================= -->

    <div
      id="mensaje"
      class="mensaje"
    ></div>


    <!-- =======================================================
         CONTADOR
         ======================================================= -->

    <div class="info">

      <div
        id="contador"
        class="contador"
      ></div>

    </div>


    <!-- =======================================================
         TABLA
         ======================================================= -->

    <div class="tabla-contenedor">

      <table>

        <thead>

          <tr>

            <th>
              Jugador
            </th>

            <th>
              Sueño
            </th>

            <th>
              Fatiga
            </th>

            <th>
              Estrés
            </th>

            <th>
              Dolor
            </th>

            <th>
              Molestias
            </th>

            <th>
              Comentario
            </th>

          </tr>

        </thead>


        <tbody id="tablaWellness"></tbody>

      </table>

    </div>


    <!-- =======================================================
         VOLVER
         ======================================================= -->

    <button
      type="button"
      class="boton-volver"
      onclick="volverAdmin()"
    >
      VOLVER
    </button>


  </div>



  <script>


    // =========================================================
    // SUPABASE
    // =========================================================

    const SUPABASE_URL =
      "https://alprdcjaexllelxthhbv.supabase.co";


    const SUPABASE_KEY =
      "sb_publishable_6kF4hhGM3bwqgwv6Fz3mmw__HvkPXiD";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );



    // =========================================================
    // EQUIPOS
    // =========================================================

    let equipos = [];



    // =========================================================
    // JUGADORES
    // =========================================================

    let jugadoresActuales = [];



    // =========================================================
    // FECHA DE HOY
    // =========================================================

    function fechaHoyLocal() {

      const ahora =
        new Date();


      const año =
        ahora.getFullYear();


      const mes =
        String(
          ahora.getMonth() + 1
        ).padStart(
          2,
          "0"
        );


      const dia =
        String(
          ahora.getDate()
        ).padStart(
          2,
          "0"
        );


      return `${año}-${mes}-${dia}`;

    }



    // =========================================================
    // FECHA LOCAL A ISO
    // =========================================================

    function fechaLocalAISO(
      fechaTexto
    ) {

      const partes =
        fechaTexto.split("-");


      const año =
        Number(
          partes[0]
        );


      const mes =
        Number(
          partes[1]
        ) - 1;


      const dia =
        Number(
          partes[2]
        );


      return new Date(
        año,
        mes,
        dia,
        0,
        0,
        0,
        0
      );

    }



    // =========================================================
    // ESCAPAR HTML
    // =========================================================

    function escaparHTML(
      texto
    ) {

      if (
        texto === null ||
        texto === undefined
      ) {

        return "";

      }


      return String(texto)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }



    // =========================================================
    // MOSTRAR MENSAJE
    // =========================================================

    function mostrarMensaje(
      texto,
      error = false
    ) {

      const mensaje =
        document.getElementById(
          "mensaje"
        );


      mensaje.textContent =
        texto;


      mensaje.className =
        "mensaje";


      if (error) {

        mensaje.classList.add(
          "error"
        );

      }


      mensaje.style.display =
        "block";

    }



    // =========================================================
    // OCULTAR MENSAJE
    // =========================================================

    function ocultarMensaje() {

      const mensaje =
        document.getElementById(
          "mensaje"
        );


      mensaje.style.display =
        "none";

    }



    // =========================================================
    // CARGAR EQUIPOS
    // =========================================================

    async function cargarEquipos() {

      const selectEquipo =
        document.getElementById(
          "equipo"
        );


      selectEquipo.innerHTML = `

        <option value="">
          Cargando equipos...
        </option>

      `;


      try {

        const {
          data,
          error
        } = await supabaseClient

          .from("equipos")

          .select(
            "id, nombre"
          )

          .order(
            "nombre",
            {
              ascending: true
            }
          );


        if (error) {

          console.error(
            "Error cargando equipos:",
            error
          );

          throw error;

        }


        equipos =
          data || [];


        selectEquipo.innerHTML = `

          <option value="">
            Selecciona un equipo
          </option>

        `;


        equipos.forEach(
          equipo => {

            const opcion =
              document.createElement(
                "option"
              );


            opcion.value =
              equipo.id;


            opcion.textContent =
              equipo.nombre;


            selectEquipo.appendChild(
              opcion
            );

          }
        );


        if (
          equipos.length > 0
        ) {

          selectEquipo.value =
            equipos[0].id;


          await cargarJugadores(
            equipos[0].id
          );

        } else {

          mostrarMensaje(
            "No hay equipos configurados.",
            false
          );

        }


      } catch (error) {

        console.error(
          error
        );


        selectEquipo.innerHTML = `

          <option value="">
            Error al cargar equipos
          </option>

        `;


        mostrarMensaje(
          "No se han podido cargar los equipos desde Supabase.",
          true
        );

      }

    }



    // =========================================================
    // CARGAR JUGADORES
    // =========================================================

    async function cargarJugadores(
      equipoId
    ) {

      jugadoresActuales =
        [];


      if (!equipoId) {

        return;

      }


      try {

        const {
          data,
          error
        } = await supabaseClient

          .from("jugadores")

          .select(
            "id, nombre, equipo_id"
          )

          .eq(
            "equipo_id",
            equipoId
          )

          .order(
            "nombre",
            {
              ascending: true
            }
          );


        if (error) {

          console.error(
            "Error cargando jugadores:",
            error
          );

          throw error;

        }


        jugadoresActuales =
          data || [];


      } catch (error) {

        console.error(
          error
        );


        jugadoresActuales =
          [];


        mostrarMensaje(
          "No se han podido cargar los jugadores del equipo.",
          true
        );

      }

    }



    // =========================================================
    // PINTAR SUEÑO
    // =========================================================

    function pintarSueno(
      valor
    ) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {

        return `

          <span class="sin-respuesta">
            —
          </span>

        `;

      }


      const numero =
        Number(valor);


      return `

        <span class="valor sueno-${numero}">
          ${escaparHTML(numero)}
        </span>

      `;

    }



    // =========================================================
    // PINTAR RIESGO
    // =========================================================

    function pintarRiesgo(
      valor
    ) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {

        return `

          <span class="sin-respuesta">
            —
          </span>

        `;

      }


      const numero =
        Number(valor);


      return `

        <span class="valor riesgo-${numero}">
          ${escaparHTML(numero)}
        </span>

      `;

    }



    // =========================================================
    // PINTAR MOLESTIAS
    // =========================================================

    function pintarMolestias(
      valor
    ) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {

        return `

          <span class="sin-respuesta">
            —
          </span>

        `;

      }


      const texto =
        String(valor)
          .trim()
          .toLowerCase();


      if (
        texto === "si"
      ) {

        return `

          <span class="molestias-si">
            Sí
          </span>

        `;

      }


      return `

        <span class="molestias-no">
          No
        </span>

      `;

    }



    // =========================================================
    // CONSULTAR WELLNESS
    // =========================================================

    async function consultarWellness() {

      ocultarMensaje();


      const equipoId =
        document.getElementById(
          "equipo"
        ).value;


      const fecha =
        document.getElementById(
          "fecha"
        ).value;


      const tabla =
        document.getElementById(
          "tablaWellness"
        );


      const contador =
        document.getElementById(
          "contador"
        );


      const tablaContenedor =
        document.querySelector(
          ".tabla-contenedor"
        );



      // =======================================================
      // COMPROBAR EQUIPO
      // =======================================================

      if (!equipoId) {

        mostrarMensaje(
          "Selecciona un equipo antes de consultar.",
          true
        );


        tablaContenedor.style.display =
          "none";


        contador.textContent =
          "";


        return;

      }



      // =======================================================
      // COMPROBAR FECHA
      // =======================================================

      if (!fecha) {

        mostrarMensaje(
          "Selecciona un día antes de consultar.",
          true
        );


        tablaContenedor.style.display =
          "none";


        contador.textContent =
          "";


        return;

      }



      // =======================================================
      // EQUIPO SELECCIONADO
      // =======================================================

      const equipoSeleccionado =
        equipos.find(
          equipo =>
            equipo.id === equipoId
        );


      if (!equipoSeleccionado) {

        mostrarMensaje(
          "No se ha encontrado el equipo seleccionado.",
          true
        );


        return;

      }


      const equipoNombre =
        equipoSeleccionado.nombre;



      // =======================================================
      // CARGAR JUGADORES
      // =======================================================

      await cargarJugadores(
        equipoId
      );



      // =======================================================
      // MOSTRAR TABLA
      // =======================================================

      tablaContenedor.style.display =
        "block";


      tabla.innerHTML = `

        <tr>

          <td
            colspan="7"
            class="cargando"
          >

            Cargando respuestas...

          </td>

        </tr>

      `;


      contador.textContent =
        "Consultando...";



      try {


        // =====================================================
        // INICIO DEL DÍA
        // =====================================================

        const desde =
          fechaLocalAISO(
            fecha
          );



        // =====================================================
        // FINAL DEL DÍA
        // =====================================================

        const hasta =
          new Date(
            desde
          );


        hasta.setDate(
          hasta.getDate() + 1
        );



        // =====================================================
        // CONSULTA SUPABASE
        // =====================================================

        const {
          data,
          error
        } = await supabaseClient

          .from("respuestas")

          .select("*")

          .eq(
            "equipo",
            equipoNombre
          )

          .eq(
            "tipo",
            "wellness"
          )

          .gte(
            "fecha",
            desde.toISOString()
          )

          .lt(
            "fecha",
            hasta.toISOString()
          )

          .order(
            "fecha",
            {
              ascending: true
            }
          );



        // =====================================================
        // COMPROBAR ERROR
        // =====================================================

        if (error) {

          console.error(
            "Error Supabase:",
            error
          );


          throw error;

        }



        // =====================================================
        // ORGANIZAR RESPUESTAS
        // =====================================================

        const respuestasPorJugador =
          {};


        (data || []).forEach(
          registro => {

            respuestasPorJugador[
              registro.jugador
            ] = registro;

          }
        );



        // =====================================================
        // CONTADOR
        // =====================================================

        let numeroRespuestas =
          0;


        jugadoresActuales.forEach(
          jugador => {

            if (
              respuestasPorJugador[
                jugador.nombre
              ]
            ) {

              numeroRespuestas++;

            }

          }
        );


        contador.textContent =
          `${numeroRespuestas} de ${jugadoresActuales.length} jugadores han respondido`;



        // =====================================================
        // SIN JUGADORES
        // =====================================================

        if (
          jugadoresActuales.length === 0
        ) {

          tabla.innerHTML = `

            <tr>

              <td
                colspan="7"
                class="cargando"
              >

                No hay jugadores configurados
                para este equipo.

              </td>

            </tr>

          `;


          return;

        }



        // =====================================================
        // LIMPIAR TABLA
        // =====================================================

        tabla.innerHTML =
          "";



        // =====================================================
        // CREAR FILAS
        // =====================================================

        jugadoresActuales.forEach(
          jugador => {


            const nombreJugador =
              jugador.nombre;


            const registro =
              respuestasPorJugador[
                nombreJugador
              ];



            // =================================================
            // SIN RESPUESTA
            // =================================================

            if (!registro) {

              const fila =
                document.createElement(
                  "tr"
                );


              fila.innerHTML = `

                <td>
                  ${escaparHTML(
                    nombreJugador
                  )}
                </td>


                <td>
                  <span class="sin-respuesta">
                    —
                  </span>
                </td>


                <td>
                  <span class="sin-respuesta">
                    —
                  </span>
                </td>


                <td>
                  <span class="sin-respuesta">
                    —
                  </span>
                </td>


                <td>
                  <span class="sin-respuesta">
                    —
                  </span>
                </td>


                <td>
                  <span class="sin-respuesta">
                    —
                  </span>
                </td>


                <td>
                  <span class="sin-respuesta">
                    Sin respuesta
                  </span>
                </td>

              `;


              tabla.appendChild(
                fila
              );


              return;

            }



            // =================================================
            // RESPUESTAS
            // =================================================

            const respuestas =
              registro.respuestas || {};


            const sueño =
              respuestas.sueno;


            const fatiga =
              respuestas.fatiga;


            const estres =
              respuestas.estres;


            const dolor =
              respuestas.dolor;


            const molestias =
              respuestas.molestias;


            const comentario =
              respuestas.comentario;



            // =================================================
            // COMENTARIO
            // =================================================

            let comentarioHTML = `

              <span class="sin-respuesta">
                —
              </span>

            `;


            if (
              comentario !== null &&
              comentario !== undefined &&
              String(
                comentario
              ).trim() !== ""
            ) {

              comentarioHTML =
                escaparHTML(
                  comentario
                );

            }



            // =================================================
            // CREAR FILA
            // =================================================

            const fila =
              document.createElement(
                "tr"
              );


            fila.innerHTML = `

              <td>
                ${escaparHTML(
                  nombreJugador
                )}
              </td>


              <td>
                ${pintarSueno(
                  sueño
                )}
              </td>


              <td>
                ${pintarRiesgo(
                  fatiga
                )}
              </td>


              <td>
                ${pintarRiesgo(
                  estres
                )}
              </td>


              <td>
                ${pintarRiesgo(
                  dolor
                )}
              </td>


              <td>
                ${pintarMolestias(
                  molestias
                )}
              </td>


              <td>
                ${comentarioHTML}
              </td>

            `;


            tabla.appendChild(
              fila
            );

          }
        );


      } catch (error) {


        console.error(
          error
        );


        tabla.innerHTML = `

          <tr>

            <td
              colspan="7"
              class="cargando"
            >

              No se han podido cargar
              las respuestas.

            </td>

          </tr>

        `;


        contador.textContent =
          "Error al consultar los datos.";


        mostrarMensaje(
          "Ha ocurrido un error al consultar Supabase. Revisa la consola del navegador.",
          true
        );

      }

    }



    // =========================================================
    // VOLVER
    // =========================================================

    function volverAdmin() {

      window.location.href =
        "panel-admin.html";

    }



    // =========================================================
    // CAMBIO DE EQUIPO
    // =========================================================

    document.getElementById(
      "equipo"
    ).addEventListener(
      "change",
      async function () {


        const equipoId =
          this.value;


        await cargarJugadores(
          equipoId
        );


        document.querySelector(
          ".tabla-contenedor"
        ).style.display =
          "none";


        document.getElementById(
          "contador"
        ).textContent =
          "";

      }
    );



    // =========================================================
    // INICIALIZAR
    // =========================================================

    document.addEventListener(
      "DOMContentLoaded",
      async function () {


        document.getElementById(
          "fecha"
        ).value =
          fechaHoyLocal();


        await cargarEquipos();

      }
    );


  </script>
