<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del personal</title>

    <link rel="stylesheet" href="estilos.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<style>

    .boton-volver {
    display: block;
    margin: 25px auto 0;
    padding: 11px 18px;
    border: 2px solid #334155;
    border-radius: 12px;
    background: transparent;
    color: #334155;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.boton-volver:hover {
    background: #0f172a;
    color: white;
    transform: translateY(-2px);
}

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        padding: 30px 15px;
        color: #1e293b;
    }

    .contenedor {
        width: 100%;
        max-width: 850px;
        margin: 0 auto;
    }

    .cabecera {
        text-align: center;
        color: white;
        margin-bottom: 28px;
    }

    .cabecera h1 {
        margin: 0;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .cabecera p {
        margin: 8px 0 0;
        color: #cbd5e1;
        font-size: 16px;
    }

    .formulario {
        background: white;
        border-radius: 22px;
        padding: 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.30);
    }

    label {
        display: block;
        margin-top: 22px;
        margin-bottom: 9px;
        font-size: 14px;
        font-weight: 700;
        color: #334155;
    }

    label:first-of-type {
        margin-top: 0;
    }

    select {
        width: 100%;
        height: 54px;
        padding: 0 16px;
        border: 2px solid #e2e8f0;
        border-radius: 13px;
        background: #f8fafc;
        color: #1e293b;
        font-size: 16px;
        outline: none;
        cursor: pointer;
        transition: 0.2s;
    }

    select:hover {
        border-color: #94a3b8;
    }

    select:focus {
        border-color: #2563eb;
        background: white;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
    }

    #resultados {
        margin-top: 32px;
    }

    #resultados h2 {
        margin: 0 0 18px;
        padding-bottom: 12px;
        border-bottom: 2px solid #e2e8f0;
        color: #0f172a;
        font-size: 23px;
    }

    #resultados > p {
        padding: 17px;
        margin: 0;
        text-align: center;
        background: #f1f5f9;
        border-radius: 13px;
        color: #64748b;
    }

    .registro {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 15px;
        transition: 0.2s;
    }

    .registro:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
    }

    .registro p {
        margin: 9px 0;
        color: #475569;
        line-height: 1.5;
    }

    .registro p:first-child {
        margin-top: 0;
        padding-bottom: 11px;
        border-bottom: 1px solid #e2e8f0;
    }

    .registro p:last-child {
        margin-bottom: 0;
    }

    .registro strong {
        color: #1e293b;
    }

    .botones-consulta {
    display: flex;
    gap: 15px;
    width: 100%;
}

.boton-consulta {
    flex: 1;
    height: 58px;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    background: #f8fafc;
    color: #334155;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.boton-consulta:hover {
    transform: translateY(-2px);
    border-color: #94a3b8;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
}

.boton-consulta.activo {
    background: #0f172a;
    color: white;
    border-color: #0f172a;
    box-shadow: 0 7px 18px rgba(15, 23, 42, 0.20);
}

@media (max-width: 600px) {

    .botones-consulta {
        gap: 10px;
    }

    .boton-consulta {
        height: 54px;
        font-size: 15px;
    }
}

    @media (max-width: 600px) {

        body {
            padding: 20px 12px;
        }

        .cabecera h1 {
            font-size: 29px;
        }

        .formulario {
            padding: 22px 17px;
            border-radius: 18px;
        }

        select {
            height: 51px;
            font-size: 15px;
        }

        .registro {
            padding: 17px;
        }
    }

</style>

<body>

<div class="contenedor">


    <div class="cabecera">
        <h1>Panel del personal</h1>
        <p>Consulta de RPE y Wellness</p>
    </div>

    <div class="formulario">

        <label>Equipo</label>

        <select id="equipo">
            <option value="">Selecciona un equipo</option>
        </select>

        <label>Jugador</label>

        <select id="jugador">
            <option value="">Selecciona un jugador</option>
        </select>

        <label>¿Qué quieres consultar?</label>

<div class="botones-consulta">

    <button type="button" class="boton-consulta" id="botonRPE">
        RPE
    </button>

    <button type="button" class="boton-consulta" id="botonWellness">
        Wellness
    </button>

</div>

<select id="tipoConsulta" style="display: none;">
    <option value="">Selecciona una opción</option>
    <option value="rpe">RPE</option>
    <option value="wellness">Wellness</option>
</select>

        <div id="resultados"></div>

        <button type="button" class="boton-volver" onclick="history.back()">
    ← Volver
</button>

    </div>

</div>


<script>

// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
    "https://alprdcjaexllelxthhbv.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_6kF4hhGM3bwqgwv6Fz3mmw__HvkPXiD";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ===============================
// CARGAR EQUIPOS
// ===============================

async function cargarEquipos() {

    const equipo =
        document.getElementById("equipo");

    equipo.innerHTML =
        '<option value="">Selecciona un equipo</option>';

    const { data, error } =
        await supabaseClient
            .from("equipos")
            .select("*")
            .order("nombre", {
                ascending: true
            });

    if (error) {

        console.error(error);

        equipo.innerHTML =
            '<option value="">Error al cargar equipos</option>';

        return;
    }

    data.forEach(function(item) {

        const opcion =
            document.createElement("option");

        opcion.value = item.id;

        opcion.textContent =
            item.nombre;

        equipo.appendChild(opcion);

    });

}


// ===============================
// CAMBIO DE EQUIPO
// ===============================

document.getElementById("equipo").addEventListener("change", async function() {

    const equipoId =
        this.value;

    const jugador =
        document.getElementById("jugador");

    jugador.innerHTML =
        '<option value="">Selecciona un jugador</option>';

    document.getElementById("tipoConsulta").value = "";

    document.getElementById("resultados").innerHTML = "";


    if (!equipoId) {
        return;
    }


    const { data, error } =
        await supabaseClient
            .from("jugadores")
            .select("*")
            .eq("equipo_id", equipoId)
            .order("nombre", {
                ascending: true
            });


    if (error) {

        console.error(error);

        jugador.innerHTML =
            '<option value="">Error al cargar jugadores</option>';

        return;
    }


    data.forEach(function(item) {

        const opcion =
            document.createElement("option");

        opcion.value =
            item.nombre;

        opcion.textContent =
            item.nombre;

        jugador.appendChild(opcion);

    });

});


// ===============================
// CAMBIO DE JUGADOR
// ===============================

document.getElementById("jugador").addEventListener("change", function() {

    document.getElementById("tipoConsulta").value = "";

    document.getElementById("resultados").innerHTML = "";

});


// ===============================
// CONSULTAR SUPABASE
// ===============================

async function consultarRegistros() {

    const equipoSelect =
        document.getElementById("equipo");

    const equipoSeleccionado =
        equipoSelect.value;

    const jugadorSeleccionado =
        document.getElementById("jugador").value;

    const tipoSeleccionado =
        document.getElementById("tipoConsulta").value;

    const resultados =
        document.getElementById("resultados");


    if (
        equipoSeleccionado === "" ||
        jugadorSeleccionado === "" ||
        tipoSeleccionado === ""
    ) {

        resultados.innerHTML = "";

        return;

    }


    // Obtenemos el nombre visible del equipo
    const equipoNombre =
        equipoSelect.options[
            equipoSelect.selectedIndex
        ].textContent;


    resultados.innerHTML =
        "<p>Cargando datos...</p>";


    const { data, error } =
        await supabaseClient
            .from("respuestas")
            .select("*")
            .eq("equipo", equipoNombre)
            .eq("jugador", jugadorSeleccionado)
            .eq("tipo", tipoSeleccionado)
            .order("fecha", {
                ascending: false
            });


    if (error) {

        console.error(error);

        resultados.innerHTML =
            "<p>Error al consultar los datos.</p>";

        return;

    }


    if (!data || data.length === 0) {

        resultados.innerHTML =
            "<p>No hay registros para este jugador.</p>";

        return;

    }


    resultados.innerHTML = "";


    // ===============================
    // RPE
    // ===============================

    if (tipoSeleccionado === "rpe") {

        resultados.innerHTML =
            "<h2>RPE</h2>";


        data.forEach(function(registro) {

            const respuestas =
                registro.respuestas || {};


            const fecha =
                new Date(registro.fecha)
                    .toLocaleString("es-ES");


            resultados.innerHTML += `

                <div class="registro">

                    <p>
                        <strong>Fecha:</strong>
                        ${fecha}
                    </p>

                    <p>
                        <strong>RPE:</strong>
                        ${respuestas.rpe ?? "-"}
                    </p>

                </div>

            `;

        });

    }


    // ===============================
    // WELLNESS
    // ===============================

    if (tipoSeleccionado === "wellness") {

        resultados.innerHTML =
            "<h2>Wellness</h2>";


        data.forEach(function(registro) {

            const respuestas =
                registro.respuestas || {};


            const fecha =
                new Date(registro.fecha)
                    .toLocaleString("es-ES");


            resultados.innerHTML += `

                <div class="registro">

                    <p>
                        <strong>Fecha:</strong>
                        ${fecha}
                    </p>

                    <p>
                        <strong>Sueño:</strong>
                        ${respuestas.sueno ?? "-"}
                    </p>

                    <p>
                        <strong>Fatiga:</strong>
                        ${respuestas.fatiga ?? "-"}
                    </p>

                    <p>
                        <strong>Estrés:</strong>
                        ${respuestas.estres ?? "-"}
                    </p>

                    <p>
                        <strong>Dolor muscular:</strong>
                        ${respuestas.dolor ?? "-"}
                    </p>

                    <p>
                        <strong>Molestias:</strong>
                        ${respuestas.molestias ?? "-"}
                    </p>

                    <p>
                        <strong>Comentario:</strong>
                        ${respuestas.comentario || "-"}
                    </p>

                </div>

            `;

        });

    }

}


// ===============================
// CAMBIO DE TIPO DE CONSULTA
// ===============================

document.getElementById("tipoConsulta").addEventListener("change", function() {

    consultarRegistros();

});

document.getElementById("botonRPE").addEventListener("click", function() {

    document.getElementById("tipoConsulta").value = "rpe";

    document.getElementById("botonRPE").classList.add("activo");

    document.getElementById("botonWellness").classList.remove("activo");

    consultarRegistros();

});


document.getElementById("botonWellness").addEventListener("click", function() {

    document.getElementById("tipoConsulta").value = "wellness";

    document.getElementById("botonWellness").classList.add("activo");

    document.getElementById("botonRPE").classList.remove("activo");

    consultarRegistros();

});


// ===============================
// INICIAR
// ===============================

cargarEquipos();

</script>

</body>
</html>
