<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SD Erandio - Panel del jugador</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    padding: 30px 15px;
    color: #1e293b;
}

        .contenedor {
    width: 100%;
    max-width: 850px;
    margin: 0 auto;
    background: white;
    padding: 32px;
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.30);
}

       .cabecera {
    text-align: center;
    margin-bottom: 28px;
}

.cabecera h1 {
    margin: 0;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: #0f172a;
}

.cabecera p {
    margin: 8px 0 0;
    color: #64748b;
    font-size: 16px;
}

        .formulario {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 22px;
            margin-bottom: 8px;
        }

        #formularioWellness label {
            margin-top: 25px;
            margin-bottom: 8px;
        }

        #formularioWellness input,
        #formularioWellness select,
        #formularioWellness textarea {
            margin-bottom: 15px;
        }

        select,
input,
textarea {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    background: #f8fafc;
    color: #1e293b;
    transition: all 0.2s ease;
}

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        select:focus,
input:focus,
textarea:focus {
    outline: none;
    border-color: #0f172a;
    background: white;
    box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
}

        hr {
            width: 100%;
            border: 0;
            border-top: 1px solid #ddd;
            margin: 30px 0 10px 0;
        }

        .titulo-seccion {
    font-size: 21px;
    margin-top: 20px;
    margin-bottom: 7px;
    color: #0f172a;
}

.ayuda {
    color: #64748b;
    font-size: 14px;
    line-height: 1.5;
    margin-top: 0;
    margin-bottom: 18px;
}

        .botones-tipo {
    display: flex;
    gap: 15px;
    margin-top: 12px;
}

.boton-tipo {
    flex: 1;
    height: 58px;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    background: #f8fafc;
    color: #334155;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
}

.boton-tipo:hover {
    transform: translateY(-2px);
    border-color: #94a3b8;
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
}

.boton-tipo.activo {
    background: #0f172a;
    color: white;
    border-color: #0f172a;
    box-shadow: 0 7px 18px rgba(15, 23, 42, 0.20);
}

        .formulario-registro {
    display: none;
    margin-top: 25px;
    padding: 24px;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    background: #f8fafc;
}
        .boton-enviar {
    width: 100%;
    height: 56px;
    padding: 0 18px;
    margin-top: 30px;
    border: none;
    border-radius: 14px;
    background: #0f172a;
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 7px 18px rgba(15, 23, 42, 0.20);
}

.boton-enviar:hover {
    background: #1e293b;
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(15, 23, 42, 0.25);
}

        .boton-volver {
    display: block;
    margin: 25px auto 0;
    padding: 11px 18px;
    border: 2px solid #334155;
    border-radius: 12px;
    background: transparent;
    color: #334155;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

.boton-volver:hover {
    background: #0f172a;
    color: white;
    transform: translateY(-2px);
}

        .mensaje {
            display: none;
            padding: 14px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .mensaje.exito {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .mensaje.error {
            display: block;
            background: #ffebee;
            color: #c62828;
        }

        .oculto {
            display: none;
        }

        /* BOTONES WELLNESS DEL 1 AL 5 */

.escala-wellness {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 8px;
    width: 100%;
    margin-bottom: 15px;
}

.boton-escala {
    min-width: 0;
    height: 48px;
    border: 2px solid transparent;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .2s ease, border-color .2s ease;
}

.boton-escala:nth-child(1) {
    background: #d32f2f;
}

.boton-escala:nth-child(2) {
    background: #f57c00;
}

.boton-escala:nth-child(3) {
    background: #fbc02d;
    color: #1e293b;
}

.boton-escala:nth-child(4) {
    background: #7cb342;
}

.boton-escala:nth-child(5) {
    background: #2e7d32;
}

.boton-escala.seleccionado {
    border-color: #0f172a;
    box-shadow: 0 0 0 3px rgba(15, 23, 42, .18);
    transform: translateY(-2px);
}

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .contenedor {
                margin: 10px auto;
                padding: 25px 20px;
            }

            .cabecera h1 {
                font-size: 26px;
            }

            .botones-tipo {
                flex-direction: column;
            }

        }

    </style>
</head>


<body>

    <div class="contenedor">

        <div class="cabecera">

            <h1>SD ERANDIO CLUB</h1>

            <p>Registro diario del jugador</p>

        </div>


        <div class="formulario">


            <!-- EQUIPO -->

            <label for="equipo">
                Equipo
            </label>

            <select id="equipo" onchange="actualizarJugadores()">

                <option value="">
                    Cargando equipos...
                </option>

            </select>


            <!-- JUGADOR -->

            <label for="jugador">
                Jugador
            </label>

            <select id="jugador" onchange="comprobarJugador()">

                <option value="">
                    Selecciona tu nombre
                </option>

            </select>


            <!-- ELECCIÓN DEL REGISTRO -->

            <div id="seleccionRegistro" class="oculto">

                <hr>

                <h2 class="titulo-seccion">
                    ¿Qué quieres registrar?
                </h2>

                <div class="botones-tipo">

                    <button
                        type="button"
                        id="botonRPE"
                        class="boton-tipo"
                        onclick="mostrarRPE()"
                    >
                        RPE
                    </button>

                    <button
                        type="button"
                        id="botonWellness"
                        class="boton-tipo"
                        onclick="mostrarWellness()"
                    >
                        WELLNESS
                    </button>

                </div>

            </div>


            <!-- FORMULARIO RPE -->

            <div
                id="formularioRPE"
                class="formulario-registro"
            >

                <h2 class="titulo-seccion">
                    RPE
                </h2>

                <p class="ayuda">
                    Indica la intensidad que has percibido en el entrenamiento.
                </p>


                <label for="rpe">
                    RPE del entrenamiento
                </label>

                <input
                    type="number"
                    id="rpe"
                    min="1"
                    max="10"
                    placeholder="Del 1 al 10"
                >

            </div>


            <!-- FORMULARIO WELLNESS -->

            <div
                id="formularioWellness"
                class="formulario-registro"
            >

                <h2 class="titulo-seccion">
                    Wellness
                </h2>

                <p class="ayuda">
                    Responde a las siguientes preguntas del 1 al 5.
                </p>


                <!-- SUEÑO -->

                <label for="sueno">
                   CALIDAD DE SUEÑO 1-Muy mala 5-Muy buena
                </label>

                <div class="escala-wellness" role="group" aria-label="Calidad de sueño del 1 al 5">

    <button type="button" class="boton-escala" data-pregunta="sueno" data-valor="1" onclick="seleccionarWellness('sueno', 1)">1</button>

    <button type="button" class="boton-escala" data-pregunta="sueno" data-valor="2" onclick="seleccionarWellness('sueno', 2)">2</button>

    <button type="button" class="boton-escala" data-pregunta="sueno" data-valor="3" onclick="seleccionarWellness('sueno', 3)">3</button>

    <button type="button" class="boton-escala" data-pregunta="sueno" data-valor="4" onclick="seleccionarWellness('sueno', 4)">4</button>

    <button type="button" class="boton-escala" data-pregunta="sueno" data-valor="5" onclick="seleccionarWellness('sueno', 5)">5</button>

</div>

<input type="hidden" id="sueno">


                <!-- FATIGA -->

                <label for="fatiga">
    FATIGA 1-Muy fatigado 5-Muy fresco
</label>

<div class="escala-wellness" role="group" aria-label="Fatiga del 1 al 5">

    <button type="button" class="boton-escala" data-pregunta="fatiga" data-valor="1" onclick="seleccionarWellness('fatiga', 1)">1</button>

    <button type="button" class="boton-escala" data-pregunta="fatiga" data-valor="2" onclick="seleccionarWellness('fatiga', 2)">2</button>

    <button type="button" class="boton-escala" data-pregunta="fatiga" data-valor="3" onclick="seleccionarWellness('fatiga', 3)">3</button>

    <button type="button" class="boton-escala" data-pregunta="fatiga" data-valor="4" onclick="seleccionarWellness('fatiga', 4)">4</button>

    <button type="button" class="boton-escala" data-pregunta="fatiga" data-valor="5" onclick="seleccionarWellness('fatiga', 5)">5</button>

</div>

<input type="hidden" id="fatiga">


                <!-- ESTRÉS -->

                <label for="estres">
                    ESTRÉS 1-Mucho  5-Ningúno
                </label>

                <div class="escala-wellness" role="group" aria-label="Estrés del 1 al 5">

    <button type="button" class="boton-escala" data-pregunta="estres" data-valor="1" onclick="seleccionarWellness('estres', 1)">1</button>

    <button type="button" class="boton-escala" data-pregunta="estres" data-valor="2" onclick="seleccionarWellness('estres', 2)">2</button>

    <button type="button" class="boton-escala" data-pregunta="estres" data-valor="3" onclick="seleccionarWellness('estres', 3)">3</button>

    <button type="button" class="boton-escala" data-pregunta="estres" data-valor="4" onclick="seleccionarWellness('estres', 4)">4</button>

    <button type="button" class="boton-escala" data-pregunta="estres" data-valor="5" onclick="seleccionarWellness('estres', 5)">5</button>

</div>

<input type="hidden" id="estres">


                <!-- DOLOR MUSCULAR -->

                <label for="dolorMuscular">
                    DOLOR 1-Mucho  5-Ningúno
                </label>

                <div class="escala-wellness" role="group" aria-label="Dolor muscular del 1 al 5">

    <button type="button" class="boton-escala" data-pregunta="dolorMuscular" data-valor="1" onclick="seleccionarWellness('dolorMuscular', 1)">1</button>

    <button type="button" class="boton-escala" data-pregunta="dolorMuscular" data-valor="2" onclick="seleccionarWellness('dolorMuscular', 2)">2</button>

    <button type="button" class="boton-escala" data-pregunta="dolorMuscular" data-valor="3" onclick="seleccionarWellness('dolorMuscular', 3)">3</button>

    <button type="button" class="boton-escala" data-pregunta="dolorMuscular" data-valor="4" onclick="seleccionarWellness('dolorMuscular', 4)">4</button>

    <button type="button" class="boton-escala" data-pregunta="dolorMuscular" data-valor="5" onclick="seleccionarWellness('dolorMuscular', 5)">5</button>

</div>

<input type="hidden" id="dolorMuscular">


                <!-- MOLESTIAS -->

                <label for="molestias">
                    ¿Tienes molestias?
                </label>

                <select id="molestias">

                    <option value="">
                        Selecciona una opción
                    </option>

                    <option value="si">
                        Sí
                    </option>

                    <option value="no">
                        No
                    </option>

                </select>


                <!-- COMENTARIO -->

                <label for="comentario">
                    Comentario
                </label>

                <textarea
                    id="comentario"
                    placeholder="¿Quieres añadir algún comentario?"
                ></textarea>

            </div>


            <!-- MENSAJE -->

            <div
                id="mensaje"
                class="mensaje"
            ></div>


            <!-- BOTÓN ENVIAR -->

            <button
                type="button"
                id="botonEnviar"
                class="boton-enviar"
                style="display: none;"
                onclick="enviarRegistro()"
            >
                Enviar registro
            </button>


            <!-- VOLVER -->

            <button
                type="button"
                class="boton-volver"
                onclick="window.location.href='index.html'"
            >
                Volver
            </button>

        </div>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /*
        =====================================================
        CONEXIÓN CON SUPABASE
        =====================================================
        */

        const SUPABASE_URL =
            "https://alprdcjaexllelxthhbv.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_6kF4hhGM3bwqgwv6Fz3mmw__HvkPXiD";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /*
        =====================================================
        CONFIGURACIÓN
        =====================================================
        */

        let tipoRegistro = "";


        /*
        =====================================================
        CARGAR EQUIPOS DESDE SUPABASE
        =====================================================
        */

        async function cargarEquipos() {

            const selector =
                document.getElementById("equipo");


            const { data, error } =
                await supabaseClient
                    .from("equipos")
                    .select("*")
                    .order("nombre", {
                        ascending: true
                    });


            if (error) {

                console.error(
                    "Error al cargar equipos:",
                    error
                );

                selector.innerHTML =
                    '<option value="">Error al cargar equipos</option>';

                mostrarMensaje(
                    "No se han podido cargar los equipos.",
                    "error"
                );

                return;

            }


            selector.innerHTML =
                '<option value="">Selecciona tu equipo</option>';


            if (!data || data.length === 0) {

                selector.innerHTML =
                    '<option value="">No hay equipos disponibles</option>';

                return;

            }


            data.forEach(function(equipo) {

                const opcion =
                    document.createElement("option");

                /*
                Guardamos el ID real de Supabase
                */

                opcion.value =
                    equipo.id;

                /*
                Mostramos el nombre del equipo
                */

                opcion.textContent =
                    equipo.nombre;

                selector.appendChild(opcion);

            });

        }


        /*
        =====================================================
        CARGAR EQUIPOS AL ABRIR LA PÁGINA
        =====================================================
        */

        cargarEquipos();


        /*
        =====================================================
        ACTUALIZAR JUGADORES
        =====================================================
        */

        async function actualizarJugadores() {

            const equipoId =
                document.getElementById("equipo").value;


            const jugador =
                document.getElementById("jugador");


            /*
            Reiniciar jugador
            */

            jugador.innerHTML =
                '<option value="">Cargando jugadores...</option>';


            /*
            Ocultar selección de registro
            */

            document
                .getElementById("seleccionRegistro")
                .classList.add("oculto");


            ocultarFormularios();


            /*
            Si no hay equipo seleccionado
            */

            if (!equipoId) {

                jugador.innerHTML =
                    '<option value="">Selecciona tu nombre</option>';

                return;

            }


            /*
            Buscar jugadores de ese equipo
            */

            const { data, error } =
                await supabaseClient
                    .from("jugadores")
                    .select("*")
                    .eq("equipo_id", equipoId)
                    .order("nombre", {
                        ascending: true
                    });


            if (error) {

                console.error(
                    "Error al cargar jugadores:",
                    error
                );

                jugador.innerHTML =
                    '<option value="">Error al cargar jugadores</option>';

                mostrarMensaje(
                    "No se han podido cargar los jugadores.",
                    "error"
                );

                return;

            }


            /*
            Reiniciar selector
            */

            jugador.innerHTML =
                '<option value="">Selecciona tu nombre</option>';


            /*
            Si no hay jugadores
            */

            if (!data || data.length === 0) {

                jugador.innerHTML =
                    '<option value="">No hay jugadores en este equipo</option>';

                return;

            }


            /*
            Añadir jugadores
            */

            data.forEach(function(jugadorDatos) {

                const opcion =
                    document.createElement("option");

                opcion.value =
                    jugadorDatos.nombre;

                opcion.textContent =
                    jugadorDatos.nombre;

                jugador.appendChild(opcion);

            });

        }


        /*
        =====================================================
        COMPROBAR JUGADOR
        =====================================================
        */

        function comprobarJugador() {

            const jugador =
                document.getElementById("jugador").value;


            ocultarFormularios();


            if (jugador) {

                document
                    .getElementById("seleccionRegistro")
                    .classList.remove("oculto");

            } else {

                document
                    .getElementById("seleccionRegistro")
                    .classList.add("oculto");

            }

        }


        /*
        =====================================================
        MOSTRAR RPE
        =====================================================
        */

        function mostrarRPE() {

            tipoRegistro = "rpe";


            document
                .getElementById("formularioRPE")
                .style.display = "block";


            document
                .getElementById("formularioWellness")
                .style.display = "none";


            document
                .getElementById("botonEnviar")
                .style.display = "block";


            document
                .getElementById("botonRPE")
                .classList.add("activo");


            document
                .getElementById("botonWellness")
                .classList.remove("activo");


            limpiarMensaje();

        }


        /*
        =====================================================
        MOSTRAR WELLNESS
        =====================================================
        */

        function mostrarWellness() {

            tipoRegistro = "wellness";


            document
                .getElementById("formularioRPE")
                .style.display = "none";


            document
                .getElementById("formularioWellness")
                .style.display = "block";


            document
                .getElementById("botonEnviar")
                .style.display = "block";


            document
                .getElementById("botonWellness")
                .classList.add("activo");


            document
                .getElementById("botonRPE")
                .classList.remove("activo");


            limpiarMensaje();

        }


        /*
        =====================================================
        OCULTAR FORMULARIOS
        =====================================================
        */

        function ocultarFormularios() {

            tipoRegistro = "";


            document
                .getElementById("formularioRPE")
                .style.display = "none";


            document
                .getElementById("formularioWellness")
                .style.display = "none";


            document
                .getElementById("botonEnviar")
                .style.display = "none";


            document
                .getElementById("botonRPE")
                .classList.remove("activo");


            document
                .getElementById("botonWellness")
                .classList.remove("activo");

        }


        /*
        =====================================================
        ENVIAR REGISTRO
        =====================================================
        */

        async function enviarRegistro() {

            const equipoId =
                document.getElementById("equipo").value;

            const equipoSelect =
                document.getElementById("equipo");

            const jugador =
                document.getElementById("jugador").value;


            /*
            Obtener el nombre visible del equipo
            */

            const equipoNombre =
                equipoSelect.options[
                    equipoSelect.selectedIndex
                ]?.textContent || "";


            /*
            VALIDAR EQUIPO
            */

            if (!equipoId) {

                mostrarMensaje(
                    "Selecciona un equipo.",
                    "error"
                );

                return;

            }


            /*
            VALIDAR JUGADOR
            */

            if (!jugador) {

                mostrarMensaje(
                    "Selecciona un jugador.",
                    "error"
                );

                return;

            }


            /*
            VALIDAR TIPO
            */

            if (!tipoRegistro) {

                mostrarMensaje(
                    "Selecciona RPE o Wellness.",
                    "error"
                );

                return;

            }


            /*
            =================================================
            RPE
            =================================================
            */

            if (tipoRegistro === "rpe") {

                const rpe =
                    document
                        .getElementById("rpe")
                        .value;


                if (!rpe) {

                    mostrarMensaje(
                        "Introduce el RPE.",
                        "error"
                    );

                    return;

                }


                if (rpe < 1 || rpe > 10) {

                    mostrarMensaje(
                        "El RPE debe estar entre 1 y 10.",
                        "error"
                    );

                    return;

                }


                const registro = {

                    /*
                    Guardamos el nombre del equipo,
                    igual que en tus registros actuales.
                    */

                    equipo: equipoNombre,

                    jugador: jugador,

                    tipo: "rpe",

                    fecha:
                        new Date().toISOString(),

                    respuestas: {

                        rpe: Number(rpe)

                    }

                };


                const { error } =
                    await supabaseClient
                        .from("respuestas")
                        .insert([registro]);


                if (error) {

                    console.error(
                        "Error al guardar RPE:",
                        error
                    );

                    mostrarMensaje(
                        "Error al guardar el registro RPE.",
                        "error"
                    );

                    return;

                }


                mostrarMensaje(
                    "Registro RPE guardado correctamente.",
                    "exito"
                );


                document
                    .getElementById("rpe")
                    .value = "";


                return;

            }


            /*
            =================================================
            WELLNESS
            =================================================
            */

            if (tipoRegistro === "wellness") {

                const sueno =
                    document
                        .getElementById("sueno")
                        .value;

                const fatiga =
                    document
                        .getElementById("fatiga")
                        .value;

                const estres =
                    document
                        .getElementById("estres")
                        .value;

                const dolor =
                    document
                        .getElementById("dolorMuscular")
                        .value;

                const molestias =
                    document
                        .getElementById("molestias")
                        .value;

                const comentario =
                    document
                        .getElementById("comentario")
                        .value;


                /*
                VALIDAR PREGUNTAS
                */

                if (
                    !sueno ||
                    !fatiga ||
                    !estres ||
                    !dolor
                ) {

                    mostrarMensaje(
                        "Completa todas las preguntas de Wellness.",
                        "error"
                    );

                    return;

                }


                if (
                    sueno < 1 || sueno > 5 ||
                    fatiga < 1 || fatiga > 5 ||
                    estres < 1 || estres > 5 ||
                    dolor < 1 || dolor > 5
                ) {

                    mostrarMensaje(
                        "Las respuestas de Wellness deben estar entre 1 y 5.",
                        "error"
                    );

                    return;

                }


                if (!molestias) {

                    mostrarMensaje(
                        "Indica si tienes molestias.",
                        "error"
                    );

                    return;

                }


                const registro = {

                    /*
                    Guardamos el nombre del equipo,
                    igual que en tus registros actuales.
                    */

                    equipo: equipoNombre,

                    jugador: jugador,

                    tipo: "wellness",

                    fecha:
                        new Date().toISOString(),

                    respuestas: {

                        sueno: Number(sueno),

                        fatiga: Number(fatiga),

                        estres: Number(estres),

                        dolor: Number(dolor),

                        molestias: molestias,

                        comentario: comentario

                    }

                };


                const { error } =
                    await supabaseClient
                        .from("respuestas")
                        .insert([registro]);


                if (error) {

                    console.error(
                        "Error al guardar Wellness:",
                        error
                    );

                    mostrarMensaje(
                        "Error al guardar el registro Wellness.",
                        "error"
                    );

                    return;

                }


                mostrarMensaje(
                    "Registro Wellness guardado correctamente.",
                    "exito"
                );


                /*
                LIMPIAR WELLNESS
                */

                document
                    .getElementById("sueno")
                    .value = "";

                document
                    .getElementById("fatiga")
                    .value = "";

                document
                    .getElementById("estres")
                    .value = "";

                document
                    .getElementById("dolorMuscular")
                    .value = "";

                document
                    .getElementById("molestias")
                    .value = "";

                document
                    .getElementById("comentario")
                    .value = "";

            }

        }


        /*
        =====================================================
        MOSTRAR MENSAJE
        =====================================================
        */

        function mostrarMensaje(texto, tipo) {

            const mensaje =
                document.getElementById("mensaje");


            mensaje.textContent = texto;

            mensaje.className =
                "mensaje " + tipo;

        }

        /*
=====================================================
SELECCIONAR WELLNESS
=====================================================
*/

function seleccionarWellness(pregunta, valor) {

    // Guardar el valor en el input oculto
    document.getElementById(pregunta).value = valor;

    // Buscar todos los botones de esa pregunta
    const botones = document.querySelectorAll(
        '.boton-escala[data-pregunta="' + pregunta + '"]'
    );

    // Quitar selección de todos
    botones.forEach(function(boton) {

        boton.classList.remove("seleccionado");

    });

    // Marcar el botón pulsado
    const botonSeleccionado = document.querySelector(
        '.boton-escala[data-pregunta="' + pregunta + '"][data-valor="' + valor + '"]'
    );

    if (botonSeleccionado) {

        botonSeleccionado.classList.add("seleccionado");

    }

}


        /*
        =====================================================
        LIMPIAR MENSAJE
        =====================================================
        */


        function limpiarMensaje() {

            const mensaje =
                document.getElementById("mensaje");


            mensaje.textContent = "";

            mensaje.className = "mensaje";

        }

    </script>
