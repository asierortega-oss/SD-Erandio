<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panel Administrador</title>

    <link
        rel="stylesheet"
        href="estilos.css"
    >

    <style>

        /* =====================================================
           PANEL ADMINISTRADOR
           ===================================================== */

        .menu-admin {
            max-width: 500px;
            margin: auto;
            text-align: center;
        }


        /* =====================================================
           BOTONES PRINCIPALES
           ===================================================== */

        .menu-admin > button {
            display: block;
            width: 100%;
            margin: 15px 0;
        }


        /* =====================================================
           BOTÓN PANEL DE EQUIPOS
           ===================================================== */

        .boton-equipos {
            display: block;
            width: 100%;
            margin: 15px 0;
        }


        /* =====================================================
           OPCIONES RPE / WELLNESS
           ===================================================== */

        .opciones-equipos {
            display: none;
            margin-top: -5px;
            margin-bottom: 15px;
        }


        .opciones-equipos button {
            width: 100%;
            margin: 6px 0;
            padding: 10px;
            font-size: 14px;
        }


        /* =====================================================
           ESTILO DIFERENTE PARA LAS OPCIONES
           ===================================================== */

        .opciones-equipos button:first-child {
            margin-top: 0;
        }


        /* =====================================================
           CABECERA
           ===================================================== */

        .cabecera {
            margin-bottom: 30px;
        }

    </style>

</head>


<body>


    <div class="menu-admin">


        <!-- =================================================
             CABECERA
             ================================================= -->

        <div class="cabecera">

            <h1>
                Panel Administrador
            </h1>

            <p>
                Selecciona una opción
            </p>

        </div>


        <!-- =================================================
             PANEL PERSONAL
             ================================================= -->

        <button
            onclick="window.location.href='panel.html'"
        >
            PANEL PERSONAL
        </button>


        <!-- =================================================
             PANEL DE EQUIPOS
             ================================================= -->

        <button
            class="boton-equipos"
            onclick="mostrarOpcionesEquipos()"
        >
            PANEL DE EQUIPOS
        </button>


        <!-- =================================================
             OPCIONES DE EQUIPOS
             ================================================= -->

        <div
            id="opcionesEquipos"
            class="opciones-equipos"
        >

            <button
                onclick="window.location.href='panel-equipos.html'"
            >
                RPE
            </button>


            <button
                onclick="window.location.href='panel-wellness.html'"
            >
                WELLNESS
            </button>

        </div>


        <!-- =================================================
             EDITAR DATOS
             ================================================= -->

        <button
            onclick="window.location.href='panel-admin-datos.html'"
        >
            EDITAR DATOS
        </button>


        <!-- =================================================
             VOLVER
             ================================================= -->

        <button
            onclick="window.location.href='index.html'"
        >
            VOLVER
        </button>


    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        function mostrarOpcionesEquipos() {

            const opciones =
                document.getElementById(
                    "opcionesEquipos"
                );


            if (
                opciones.style.display === "block"
            ) {

                opciones.style.display = "none";

            } else {

                opciones.style.display = "block";

            }

        }

    </script>


</body>

</html>
