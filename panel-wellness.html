<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SD Erandio - Panel Wellness</title>

    <link rel="stylesheet" href="estilos.css">

    <style>

        /* =====================================================
           PANEL WELLNESS
           ===================================================== */

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b
                );

            padding: 30px 15px;
            color: #1e293b;
        }


        /* =====================================================
           CONTENEDOR
           ===================================================== */

        .contenedor {
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
        }


        /* =====================================================
           CABECERA
           ===================================================== */

        .cabecera {
            text-align: center;
            color: white;
            margin-bottom: 28px;
        }

        .cabecera h1 {
            margin: 0 0 8px;
            font-size: 32px;
            color: white;
        }

        .cabecera p {
            margin: 0;
            color: #cbd5e1;
            font-size: 15px;
        }


        /* =====================================================
           PANEL PRINCIPAL
           ===================================================== */

        .panel {
            background: white;
            border-radius: 22px;
            padding: 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.30);
        }


        /* =====================================================
           FILTROS
           ===================================================== */

        .filtros {
            display: grid;
            grid-template-columns:
                minmax(200px, 1fr)
                minmax(180px, 230px)
                auto;

            gap: 15px;
            align-items: end;

            margin-bottom: 20px;
        }

        .filtro {
            min-width: 0;
        }

        .filtro label {
            margin: 0 0 8px;
            font-size: 14px;
            color: #334155;
        }

        .filtro select,
        .filtro input {
            width: 100%;
            min-width: 0;
            height: 46px;

            padding: 10px 12px;

            border: 1px solid #cbd5e1;
            border-radius: 10px;

            box-sizing: border-box;
            background: white;

            font-size: 15px;
        }

        .filtro select:focus,
        .filtro input:focus {
            outline: none;
            border-color: #64748b;
        }


        /* =====================================================
           BOTÓN CONSULTAR
           ===================================================== */

        .boton-consultar {
            width: auto;
            min-width: 150px;

            height: 46px;

            margin: 0;

            padding: 10px 20px;

            border: none;
            border-radius: 10px;

            background: #0f172a;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .boton-consultar:hover {
            background: #1e293b;
            transform: translateY(-1px);
        }


        /* =====================================================
           MENSAJES
           ===================================================== */

        #mensaje {
            text-align: center;
            min-height: 22px;

            margin: 10px 0;

            font-weight: bold;
            color: #475569;
        }

        #contador {
            text-align: center;

            margin: 8px 0 15px;

            font-size: 14px;
            color: #64748b;
        }


        /* =====================================================
           TABLA
           ===================================================== */

        .tabla-contenedor {
            width: 100%;
            max-width: 100%;

            overflow-x: auto;
            overflow-y: visible;

            margin-top: 15px;

            border-radius: 12px;

            -webkit-overflow-scrolling: touch;
        }

        .tabla-contenedor table {
            width: 1160px;
            min-width: 1160px;

            border-collapse: separate;
            border-spacing: 0;

            background: white;
            table-layout: fixed;
        }

        .tabla-contenedor th,
        .tabla-contenedor td {
            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;

            padding: 10px 8px;

            text-align: center;

            box-sizing: border-box;

            white-space: nowrap;
        }


        /* =====================================================
           CABECERA TABLA
           ===================================================== */

        .tabla-contenedor th {
            background: #f1f5f9;

            color: #334155;

            font-size: 12px;
            font-weight: bold;

            position: sticky;
            top: 0;

            z-index: 3;
        }


        /* =====================================================
           COLUMNA JUGADOR
           ===================================================== */

        .tabla-contenedor th:first-child,
        .tabla-contenedor td:first-child {
            width: 190px;
            min-width: 190px;
            max-width: 190px;

            text-align: left;

            overflow: hidden;
            text-overflow: ellipsis;

            position: sticky;
            left: 0;

            z-index: 4;
        }

        .tabla-contenedor th:first-child {
            background: #e2e8f0;
        }

        .tabla-contenedor td:first-child {
            background: white;
            font-weight: bold;
        }


        /* =====================================================
           COLUMNAS WELLNESS
           ===================================================== */

        .tabla-contenedor th:nth-child(2),
        .tabla-contenedor td:nth-child(2),
        .tabla-contenedor th:nth-child(3),
        .tabla-contenedor td:nth-child(3),
        .tabla-contenedor th:nth-child(4),
        .tabla-contenedor td:nth-child(4),
        .tabla-contenedor th:nth-child(5),
        .tabla-contenedor td:nth-child(5) {

            width: 85px;
            min-width: 85px;
            max-width: 85px;
        }


        /* =====================================================
           MOLESTIAS
           ===================================================== */

        .tabla-contenedor th:nth-child(6),
        .tabla-contenedor td:nth-child(6) {

            width: 100px;
            min-width: 100px;
            max-width: 100px;

            white-space: normal;
            word-break: break-word;
        }


        /* =====================================================
           COMENTARIO
           ===================================================== */

        .tabla-contenedor th:nth-child(7),
        .tabla-contenedor td:nth-child(7) {

            width: 450px;
            min-width: 450px;
            max-width: 450px;

            text-align: left;

            white-space: normal;
            word-break: break-word;

            line-height: 1.4;
        }


        /* =====================================================
           FILAS
           ===================================================== */

        .tabla-contenedor tbody tr:hover td {
            background: #f8fafc;
        }

        .tabla-contenedor tbody tr:hover td:first-child {
            background: #f8fafc;
        }


        /* =====================================================
           BOTÓN VOLVER
           ===================================================== */

        .volver {
            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;
            border-radius: 10px;

            background: #e2e8f0;
            color: #1e293b;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .volver:hover {
            background: #cbd5e1;
            transform: translateY(-1px);
        }


        /* =====================================================
           MÓVIL
           ===================================================== */

        @media (max-width: 700px) {

            body {
                padding: 15px 8px;
            }

            .contenedor {
                width: 100%;
            }

            .cabecera {
                margin-bottom: 18px;
            }

            .cabecera h1 {
                font-size: 25px;
            }

            .cabecera p {
                font-size: 13px;
                line-height: 1.4;
            }

            .panel {
                padding: 18px 12px;

                border-radius: 16px;
            }


            /* -----------------------------
               FILTROS
               ----------------------------- */

            .filtros {
                display: flex;
                flex-direction: column;

                gap: 12px;

                width: 100%;
            }

            .filtro {
                width: 100%;
            }

            .filtro label {
                margin-bottom: 6px;
            }

            .filtro select,
            .filtro input {
                width: 100%;
                max-width: 100%;
                min-width: 0;

                height: 44px;

                font-size: 15px;
            }

            .boton-consultar {
                width: 100%;
                min-width: 0;

                margin-top: 3px;
            }


            /* -----------------------------
               TABLA
               ----------------------------- */

            .tabla-contenedor {
                width: 100%;
                max-width: 100%;

                overflow-x: auto;
            }

            .tabla-contenedor table {
                width: 720px;
                min-width: 720px;
            }


            /* -----------------------------
               JUGADOR
               ----------------------------- */

            .tabla-contenedor th:first-child,
            .tabla-contenedor td:first-child {

                width: 125px;
                min-width: 125px;
                max-width: 125px;

                padding-left: 6px;
                padding-right: 5px;

                font-size: 11px;
            }


            /* -----------------------------
               SUEÑO / FATIGA / ESTRÉS / DOLOR
               ----------------------------- */

            .tabla-contenedor th:nth-child(2),
            .tabla-contenedor td:nth-child(2),
            .tabla-contenedor th:nth-child(3),
            .tabla-contenedor td:nth-child(3),
            .tabla-contenedor th:nth-child(4),
            .tabla-contenedor td:nth-child(4),
            .tabla-contenedor th:nth-child(5),
            .tabla-contenedor td:nth-child(5) {

                width: 70px;
                min-width: 70px;
                max-width: 70px;

                padding: 7px 4px;

                font-size: 11px;
            }


            /* -----------------------------
               MOLESTIAS
               ----------------------------- */

            .tabla-contenedor th:nth-child(6),
            .tabla-contenedor td:nth-child(6) {

                width: 85px;
                min-width: 85px;
                max-width: 85px;

                padding: 7px 4px;

                font-size: 10px;
            }


            /* -----------------------------
               COMENTARIO
               ----------------------------- */

            .tabla-contenedor th:nth-child(7),
            .tabla-contenedor td:nth-child(7) {

                width: 230px;
                min-width: 230px;
                max-width: 230px;

                padding: 7px;

                font-size: 10px;
            }


            /* -----------------------------
               CABECERA TABLA
               ----------------------------- */

            .tabla-contenedor th {
                font-size: 10px;
                padding: 7px 4px;
            }

            .tabla-contenedor td {
                font-size: 10px;
                padding: 7px 4px;
            }


            /* -----------------------------
               VOLVER
               ----------------------------- */

            .volver {
                margin-top: 20px;
            }
        }


        /* =====================================================
           MÓVILES MUY PEQUEÑOS
           ===================================================== */

        @media (max-width: 380px) {

            .panel {
                padding: 15px 8px;
            }

            .tabla-contenedor table {
                width: 680px;
                min-width: 680px;
            }

            .tabla-contenedor th:first-child,
            .tabla-contenedor td:first-child {

                width: 115px;
                min-width: 115px;
                max-width: 115px;
            }

            .tabla-contenedor th:nth-child(2),
            .tabla-contenedor td:nth-child(2),
            .tabla-contenedor th:nth-child(3),
            .tabla-contenedor td:nth-child(3),
            .tabla-contenedor th:nth-child(4),
            .tabla-contenedor td:nth-child(4),
            .tabla-contenedor th:nth-child(5),
            .tabla-contenedor td:nth-child(5) {

                width: 65px;
                min-width: 65px;
                max-width: 65px;
            }

            .tabla-contenedor th:nth-child(6),
            .tabla-contenedor td:nth-child(6) {

                width: 80px;
                min-width: 80px;
                max-width: 80px;
            }

            .tabla-contenedor th:nth-child(7),
            .tabla-contenedor td:nth-child(7) {

                width: 220px;
                min-width: 220px;
                max-width: 220px;
            }
        }

    </style>

</head>


<body>

    <div class="contenedor">

        <div class="cabecera">

            <h1>Panel Wellness</h1>

            <p>
                Consulta las respuestas Wellness
                de los jugadores por equipo y día.
            </p>

        </div>


        <div class="panel">

            <!-- FILTROS -->

            <div class="filtros">

                <div class="filtro">

                    <label for="equipo">
                        Equipo
                    </label>

                    <select id="equipo">
                        <option value="">
                            Cargando equipos...
                        </option>
                    </select>

                </div>


                <div class="filtro">

                    <label for="fecha">
                        Fecha
                    </label>

                    <input
                        type="date"
                        id="fecha"
                    >

                </div>


                <button
                    type="button"
                    class="boton-consultar"
                    onclick="consultarWellness()"
                >
                    CONSULTAR
                </button>

            </div>


            <!-- MENSAJES -->

            <div id="mensaje"></div>

            <div id="contador"></div>


            <!-- TABLA -->

            <div class="tabla-contenedor">

                <table>

                    <thead>

                        <tr>

                            <th>Jugador</th>

                            <th>Sueño</th>

                            <th>Fatiga</th>

                            <th>Estrés</th>

                            <th>Dolor</th>

                            <th>Molestias</th>

                            <th>Comentario</th>

                        </tr>

                    </thead>


                    <tbody id="tablaJugadores">

                    </tbody>

                </table>

            </div>


            <!-- VOLVER -->

            <button
                class="volver"
                onclick="volverAdmin()"
            >
                VOLVER
            </button>

        </div>

    </div>


    <!-- =====================================================
         SUPABASE
         ===================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://alprdcjaexllelxthhbv.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_6kF4hhGM3bwqgwv6Fz3mmw__HvkPXiD";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* =====================================================
           CARGAR EQUIPOS
           ===================================================== */

        async function cargarEquipos() {

            const select =
                document.getElementById("equipo");

            const {
                data,
                error
            } = await supabaseClient
                .from("equipos")
                .select("id,nombre")
                .order("nombre", {
                    ascending: true
                });


            if (error) {

                console.error(error);

                document.getElementById("mensaje").textContent =
                    "Error al cargar los equipos.";

                return;
            }


            select.innerHTML = "";


            if (!data || data.length === 0) {

                select.innerHTML =
                    '<option value="">No hay equipos</option>';

                return;
            }


            data.forEach(equipo => {

                const option =
                    document.createElement("option");

                option.value = equipo.id;

                option.textContent =
                    equipo.nombre;

                select.appendChild(option);

            });


            select.value = data[0].id;


            await cargarJugadores(
                data[0].id
            );

        }


        /* =====================================================
           CARGAR JUGADORES
           ===================================================== */

        async function cargarJugadores(equipoId) {

            const {
                data,
                error
            } = await supabaseClient
                .from("jugadores")
                .select("id,nombre,equipo_id")
                .eq("equipo_id", equipoId)
                .order("nombre", {
                    ascending: true
                });


            if (error) {

                console.error(error);

                return [];
            }


            return data || [];
        }


        /* =====================================================
           CONSULTAR WELLNESS
           ===================================================== */

        async function consultarWellness() {

            const selectEquipo =
                document.getElementById("equipo");

            const fecha =
                document.getElementById("fecha").value;


            const mensaje =
                document.getElementById("mensaje");

            const contador =
                document.getElementById("contador");

            const tabla =
                document.getElementById("tablaJugadores");


            tabla.innerHTML = "";

            contador.textContent = "";


            if (!selectEquipo.value) {

                mensaje.textContent =
                    "Selecciona un equipo.";

                return;
            }


            if (!fecha) {

                mensaje.textContent =
                    "Selecciona una fecha.";

                return;
            }


            mensaje.textContent =
                "Cargando...";


            const equipoId =
                selectEquipo.value;


            const equipoNombre =
                selectEquipo.options[
                    selectEquipo.selectedIndex
                ].textContent;


            const jugadores =
                await cargarJugadores(equipoId);


            if (!jugadores) {

                mensaje.textContent =
                    "No se han podido cargar los jugadores.";

                return;
            }


            /*
             * Inicio y fin del día seleccionado
             */

            const desde =
                new Date(
                    fecha + "T00:00:00"
                );


            const hasta =
                new Date(
                    desde.getTime() +
                    24 * 60 * 60 * 1000
                );


            const {
                data,
                error
            } = await supabaseClient

                .from("respuestas")

                .select("*")

                .eq("equipo", equipoNombre)

                .eq("tipo", "wellness")

                .gte(
                    "fecha",
                    desde.toISOString()
                )

                .lt(
                    "fecha",
                    hasta.toISOString()
                )

                .order(
                    "fecha",
                    {
                        ascending: true
                    }
                );


            if (error) {

                console.error(error);

                mensaje.textContent =
                    "Error al consultar las respuestas.";

                return;
            }


            /*
             * Guardamos la última respuesta
             * de cada jugador.
             */

            const respuestasPorJugador =
                {};


            (data || []).forEach(registro => {

                respuestasPorJugador[
                    registro.jugador
                ] = registro;

            });


            let numeroRespuestas = 0;


            jugadores.forEach(jugador => {

                const registro =
                    respuestasPorJugador[
                        jugador.nombre
                    ];


                if (registro) {
                    numeroRespuestas++;
                }


                const fila =
                    document.createElement("tr");


                const wellness =
                    registro &&
                    registro.respuestas
                        ? registro.respuestas
                        : {};


                const sueno =
                    wellness.sueno ?? "-";


                const fatiga =
                    wellness.fatiga ?? "-";


                const estres =
                    wellness.estres ?? "-";


                const dolor =
                    wellness.dolor ?? "-";


                const molestias =
                    wellness.molestias || "-";


                const comentario =
                    wellness.comentario || "-";


                fila.innerHTML = `

                    <td>
                        ${escaparHTML(
                            jugador.nombre
                        )}
                    </td>

                    <td class="${pintarSueno(sueno)}">
                        ${escaparHTML(sueno)}
                    </td>

                    <td class="${pintarRiesgo(fatiga)}">
                        ${escaparHTML(fatiga)}
                    </td>

                    <td class="${pintarRiesgo(estres)}">
                        ${escaparHTML(estres)}
                    </td>

                    <td class="${pintarRiesgo(dolor)}">
                        ${escaparHTML(dolor)}
                    </td>

                    <td class="${pintarMolestias(molestias)}">
                        ${escaparHTML(molestias)}
                    </td>

                    <td>
                        ${escaparHTML(comentario)}
                    </td>

                `;


                tabla.appendChild(fila);

            });


            mensaje.textContent = "";


            contador.textContent =
                numeroRespuestas +
                " de " +
                jugadores.length +
                " jugadores han respondido.";

        }


        /* =====================================================
           COLORES SUEÑO
           ===================================================== */

        function pintarSueno(valor) {

            if (
                valor === "-" ||
                valor === "" ||
                valor === null
            ) {
                return "";
            }


            const numero =
                Number(valor);


            if (numero >= 8) {
                return "wellness-verde";
            }

            if (numero >= 6) {
                return "wellness-amarillo";
            }

            return "wellness-rojo";
        }


        /* =====================================================
           COLORES RIESGO
           ===================================================== */

        function pintarRiesgo(valor) {

            if (
                valor === "-" ||
                valor === "" ||
                valor === null
            ) {
                return "";
            }


            const numero =
                Number(valor);


            if (numero <= 2) {
                return "wellness-verde";
            }

            if (numero <= 4) {
                return "wellness-amarillo";
            }

            return "wellness-rojo";
        }


        /* =====================================================
           COLORES MOLESTIAS
           ===================================================== */

        function pintarMolestias(valor) {

            if (
                valor === "-" ||
                valor === "" ||
                valor === null
            ) {
                return "";
            }


            const texto =
                String(valor)
                    .trim()
                    .toLowerCase();


            if (
                texto === "no" ||
                texto === "ninguna" ||
                texto === "ninguno"
            ) {
                return "wellness-verde";
            }


            return "wellness-amarillo";
        }


        /* =====================================================
           ESCAPAR HTML
           ===================================================== */

        function escaparHTML(texto) {

            return String(texto)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        /* =====================================================
           VOLVER
           ===================================================== */

        function volverAdmin() {

            window.location.href =
                "panel-admin.html";
        }


        /* =====================================================
           ESTILOS DE COLORES DE WELLNESS
           ===================================================== */

    </script>


    <style>

        .wellness-verde {
            background: #dcfce7 !important;
            color: #166534;
            font-weight: bold;
        }

        .wellness-amarillo {
            background: #fef3c7 !important;
            color: #92400e;
            font-weight: bold;
        }

        .wellness-rojo {
            background: #fee2e2 !important;
            color: #991b1b;
            font-weight: bold;
        }

    </style>


    <script>

        /* =====================================================
           CARGAR AL ABRIR
           ===================================================== */

        cargarEquipos();

    </script>

</body>

</html>
