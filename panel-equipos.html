<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de equipos</title>

    <link rel="stylesheet" href="estilos.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* ======================================================
           FILTROS
        ====================================================== */

        .filtros-fechas {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .filtro-fecha {
            display: flex;
            flex-direction: column;
        }

        .filtro-fecha label {
            margin-bottom: 6px;
        }

        .filtro-fecha input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #botonConsultar {
            width: 100%;
            padding: 10px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }


        /* ======================================================
           TABLA
        ====================================================== */

        .tabla-contenedor {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            table-layout: fixed;
            font-size: 12px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 3px 2px;
            text-align: center;
            white-space: nowrap;
            box-sizing: border-box;
            height: 32px;
        }


        /* ======================================================
           ANCHOS DE LAS COLUMNAS
        ====================================================== */

        .jugador-col {
            width: 130px !important;
            min-width: 130px !important;
            max-width: 130px !important;
        }

        .fecha-principal {
            font-weight: bold;
            font-size: 11px;
            padding: 3px 1px;
        }

        .subcabecera {
            width: 46px !important;
            min-width: 46px !important;
            max-width: 46px !important;

            font-size: 10px;
            padding: 3px 1px;
        }

        .carga-total-col {
            width: 65px !important;
            min-width: 65px !important;
            max-width: 65px !important;

            font-size: 11px;
        }


        /* ======================================================
           CELDAS RPE / MIN / C
        ====================================================== */

        .celda-rpe {
            width: 42px !important;
            min-width: 42px !important;
            max-width: 42px !important;

            padding: 2px !important;
        }

        .celda-min {
            width: 48px !important;
            min-width: 48px !important;
            max-width: 48px !important;

            padding: 2px !important;
        }

        .celda-carga {
            width: 50px !important;
            min-width: 50px !important;
            max-width: 50px !important;

            padding: 2px !important;

            font-weight: bold;
            font-size: 11px;
        }


        /* ======================================================
           CAMPOS DE RPE Y MINUTOS
        ====================================================== */

        .celda-rpe input,
        .celda-min input {

            display: block;

            width: 36px;
            height: 24px;

            margin: 0 auto;

            box-sizing: border-box;

            padding: 1px;

            text-align: center;

            font-size: 11px;
        }


        .celda-min .input-minutos {

            width: 42px;
            height: 23px;

            font-size: 11px;

            padding: 1px;

        }


        /* ======================================================
           CABECERAS
        ====================================================== */

        th {
            background: #f5f5f5;
        }


        /* ======================================================
           JUGADOR FIJO A LA IZQUIERDA
        ====================================================== */

        .jugador-col {

            position: sticky;

            left: 0;

            background: white;

            z-index: 2;

            text-align: left;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        /* ======================================================
           CARGA TOTAL FIJA A LA DERECHA
        ====================================================== */

        .carga-total-col {

            position: sticky;

            right: 0;

            background: white;

            z-index: 2;

            font-weight: bold;

        }


        th.carga-total-col,
        td.carga-total-col {

            background: white;

        }


        /* ======================================================
           FILA MEDIA
        ====================================================== */

        .fila-media td {

            background: #f7f7f7;

            font-weight: bold;

            font-size: 11px;

        }


        /* ======================================================
           MENSAJE
        ====================================================== */

        .mensaje {

            margin-top: 12px;

            font-weight: bold;

        }


        /* ======================================================
           COLORES DE ESCALA
        ====================================================== */

        .celda-rpe.coloreada,
        .carga-total.coloreada {

            transition:
                background-color 0.2s ease;

        }

        .celda-rpe input {

            background: transparent;

        }


        /* ======================================================
           MÓVIL
        ====================================================== */

        @media (max-width: 600px) {

            .filtros-fechas {

                grid-template-columns: 1fr;

            }

            .jugador-col {

                width: 120px !important;
                min-width: 120px !important;
                max-width: 120px !important;

            }

            .carga-total-col {

                width: 60px !important;
                min-width: 60px !important;
                max-width: 60px !important;

            }

            .celda-rpe {

                width: 40px !important;
                min-width: 40px !important;
                max-width: 40px !important;

            }

            .celda-min {

                width: 45px !important;
                min-width: 45px !important;
                max-width: 45px !important;

            }

            .celda-carga {

                width: 45px !important;
                min-width: 45px !important;
                max-width: 45px !important;

            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <div class="cabecera">

        <h1>Panel de equipos</h1>

        <p>
            Consulta de carga del equipo
        </p>

    </div>


    <div class="formulario">


        <label>Equipo</label>


        <select id="equipo">

            <option value="">
                Selecciona un equipo
            </option>

        </select>


        <div class="filtros-fechas">


            <div class="filtro-fecha">

                <label for="fechaInicio">
                    Desde
                </label>

                <input
                    type="date"
                    id="fechaInicio"
                >

            </div>


            <div class="filtro-fecha">

                <label for="fechaFin">
                    Hasta
                </label>

                <input
                    type="date"
                    id="fechaFin"
                >

            </div>


        </div>


        <button
            id="botonConsultar"
            type="button"
        >

            Consultar

        </button>


        <div
            id="mensaje"
            class="mensaje"
        ></div>


        <div class="tabla-contenedor">


            <table id="tablaPrincipal">

                <colgroup id="columnasTabla"></colgroup>

                <thead id="cabeceraTabla"></thead>

                <tbody id="tablaJugadores"></tbody>

                <tfoot id="pieTabla"></tfoot>

            </table>


        </div>


    </div>


</div>



<script>


// ======================================================
// SUPABASE
// ======================================================


const SUPABASE_URL =
    "https://alprdcjaexllelxthhbv.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_6kF4hhGM3bwqgwv6Fz3mmw__HvkPXiD";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ======================================================
// JUGADORES CARGADOS DESDE SUPABASE
// ======================================================

let jugadoresActuales = [];


// ======================================================
// CARGAR EQUIPOS
// ======================================================

async function cargarEquipos() {

    const equipo =
        document.getElementById("equipo");

    equipo.innerHTML =
        '<option value="">Selecciona un equipo</option>';


    const { data, error } =
        await supabaseClient
            .from("equipos")
            .select("*")
            .order("nombre", {
                ascending: true
            });


    if (error) {

        console.error(error);

        equipo.innerHTML =
            '<option value="">Error al cargar equipos</option>';

        return;

    }


    data.forEach(function(item) {

        const opcion =
            document.createElement("option");

        // El value será el UUID del equipo
        opcion.value =
            item.id;

        // Lo que verá el usuario
        opcion.textContent =
            item.nombre;

        equipo.appendChild(opcion);

    });

}


// ======================================================
// CARGAR JUGADORES DEL EQUIPO
// ======================================================

async function cargarJugadoresEquipo(equipoId) {

    jugadoresActuales = [];


    if (!equipoId) {

        return;

    }


    const { data, error } =
        await supabaseClient
            .from("jugadores")
            .select("*")
            .eq("equipo_id", equipoId)
            .order("nombre", {
                ascending: true
            });


    if (error) {

        console.error(error);

        return;

    }


    jugadoresActuales =
        data || [];

}


// ======================================================
// CAMBIO DE EQUIPO
// ======================================================

document
    .getElementById("equipo")
    .addEventListener(
        "change",
        async function() {

            const equipoId =
                this.value;


            // Limpiar tabla anterior
            document.getElementById(
                "tablaJugadores"
            ).innerHTML = "";

            document.getElementById(
                "cabeceraTabla"
            ).innerHTML = "";

            document.getElementById(
                "pieTabla"
            ).innerHTML = "";

            document.getElementById(
                "columnasTabla"
            ).innerHTML = "";

            document.getElementById(
                "mensaje"
            ).textContent = "";


            await cargarJugadoresEquipo(
                equipoId
            );

        }
    );


// ======================================================
// CREAR FECHA LOCAL
// ======================================================

function fechaLocal(texto) {

    const partes =
        texto.split("-");

    return new Date(

        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])

    );

}


// ======================================================
// CLAVE DE FECHA
// ======================================================

function claveFecha(fecha) {

    return (

        fecha.getFullYear() +

        "-" +

        String(
            fecha.getMonth() + 1
        ).padStart(2, "0") +

        "-" +

        String(
            fecha.getDate()
        ).padStart(2, "0")

    );

}


// ======================================================
// FORMATO DE FECHA
// ======================================================

function formatearFecha(fecha) {

    return fecha.toLocaleDateString(

        "es-ES",

        {
            day: "2-digit",
            month: "2-digit"
        }

    );

}


// ======================================================
// OBTENER TODAS LAS FECHAS
// ======================================================

function obtenerFechas(
    inicioTexto,
    finTexto
) {

    const inicio =
        fechaLocal(inicioTexto);

    const fin =
        fechaLocal(finTexto);

    const fechas = [];

    const fechaActual =
        new Date(inicio);


    while (fechaActual <= fin) {

        fechas.push(
            new Date(fechaActual)
        );

        fechaActual.setDate(
            fechaActual.getDate() + 1
        );

    }


    return fechas;

}


// ======================================================
// CARGAR TABLA
// ======================================================

async function cargarTabla() {


    const equipoSelect =
        document.getElementById(
            "equipo"
        );


    const equipoId =
        equipoSelect.value;


    const equipoNombre =
        equipoSelect.value
            ? equipoSelect.options[
                equipoSelect.selectedIndex
              ].textContent
            : "";


    const fechaInicio =
        document.getElementById(
            "fechaInicio"
        ).value;


    const fechaFin =
        document.getElementById(
            "fechaFin"
        ).value;


    const tabla =
        document.getElementById(
            "tablaJugadores"
        );


    const cabecera =
        document.getElementById(
            "cabeceraTabla"
        );


    const pie =
        document.getElementById(
            "pieTabla"
        );


    const columnasTabla =
        document.getElementById(
            "columnasTabla"
        );


    const mensaje =
        document.getElementById(
            "mensaje"
        );


    tabla.innerHTML = "";

    cabecera.innerHTML = "";

    pie.innerHTML = "";

    columnasTabla.innerHTML = "";

    mensaje.textContent = "";


    // --------------------------------------------------
    // COMPROBAR FILTROS
    // --------------------------------------------------

    if (
        !equipoId ||
        !fechaInicio ||
        !fechaFin
    ) {

        mensaje.textContent =
            "Selecciona el equipo y las dos fechas.";

        return;

    }


    if (
        fechaInicio > fechaFin
    ) {

        mensaje.textContent =
            "La fecha inicial no puede ser posterior a la fecha final.";

        return;

    }


    // --------------------------------------------------
    // COMPROBAR JUGADORES
    // --------------------------------------------------

    if (
        jugadoresActuales.length === 0
    ) {

        mensaje.textContent =
            "Este equipo no tiene jugadores.";

        return;

    }


    const fechasPeriodo =
        obtenerFechas(
            fechaInicio,
            fechaFin
        );


    mensaje.textContent =
        "Cargando datos...";


    // --------------------------------------------------
    // RANGO DE FECHAS PARA SUPABASE
    // --------------------------------------------------

    const desde =
        fechaInicio +
        "T00:00:00";


    const fechaFinal =
        fechaLocal(fechaFin);


    fechaFinal.setDate(
        fechaFinal.getDate() + 1
    );


    const hasta =
        claveFecha(fechaFinal) +
        "T00:00:00";


    // --------------------------------------------------
    // CONSULTAR SUPABASE
    // --------------------------------------------------

    const {
        data,
        error
    } = await supabaseClient

        .from("respuestas")

        .select("*")

        // IMPORTANTE:
        // respuestas.equipo guarda el nombre
        .eq(
            "equipo",
            equipoNombre
        )

        .eq(
            "tipo",
            "rpe"
        )

        .gte(
            "fecha",
            desde
        )

        .lt(
            "fecha",
            hasta
        )

        .order(
            "fecha",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        mensaje.textContent =
            "Error al consultar Supabase.";

        return;

    }


    // ==================================================
    // ORGANIZAR REGISTROS
    // ==================================================

    const registros = {};


    (data || []).forEach(
        function(registro) {

            const fechaRegistro =
                new Date(
                    registro.fecha
                );


            const fecha =
                claveFecha(
                    fechaRegistro
                );


            const clave =
                registro.jugador +
                "|" +
                fecha;


            registros[clave] =
                registro;

        }
    );


    // ==================================================
    // SOLO FECHAS CON AL MENOS UN RPE
    // ==================================================

    const fechasConRPE =
        fechasPeriodo.filter(
            function(fecha) {

                const fechaClave =
                    claveFecha(fecha);


                return (data || []).some(
                    function(registro) {

                        const fechaRegistro =
                            claveFecha(
                                new Date(
                                    registro.fecha
                                )
                            );


                        return fechaRegistro === fechaClave;

                    }
                );

            }
        );


    // ==================================================
    // SI NO HAY RPE
    // ==================================================

    if (fechasConRPE.length === 0) {

        mensaje.textContent =
            "No hay registros RPE en el periodo seleccionado.";

        return;

    }


    // ==================================================
    // CREAR COLUMNAS
    // ==================================================

    let columnasHTML = "";


    columnasHTML += `
        <col style="
            width:130px;
        ">
    `;


    fechasConRPE.forEach(
        function() {

            columnasHTML += `
                <col style="
                    width:42px;
                ">
            `;


            columnasHTML += `
                <col style="
                    width:48px;
                ">
            `;


            columnasHTML += `
                <col style="
                    width:50px;
                ">
            `;

        }
    );


    columnasHTML += `
        <col style="
            width:65px;
        ">
    `;


    columnasTabla.innerHTML =
        columnasHTML;


    // ==================================================
    // CABECERA
    // ==================================================

    let cabecera1 = `

        <tr>

            <th
                rowspan="2"
                class="jugador-col"
            >
                Jugador
            </th>

    `;


    let cabecera2 =
        "<tr>";


    fechasConRPE.forEach(
        function(fecha) {

            cabecera1 += `

                <th
                    colspan="3"
                    class="fecha-principal"
                >
                    ${formatearFecha(fecha)}
                </th>

            `;


            cabecera2 += `

                <th class="subcabecera">
                    RPE
                </th>

                <th class="subcabecera">
                    Min
                </th>

                <th class="subcabecera">
                    C
                </th>

            `;

        }
    );


    cabecera1 += `

            <th
                rowspan="2"
                class="carga-total-col"
            >
                Carga
            </th>

        </tr>

    `;


    cabecera2 +=
        "</tr>";


    cabecera.innerHTML =
        cabecera1 +
        cabecera2;


    // ==================================================
    // MEDIAS
    // ==================================================

    const medias = {};


    fechasConRPE.forEach(
        function(fecha) {

            const clave =
                claveFecha(fecha);


            medias[clave] = {

                suma: 0,

                cantidad: 0

            };

        }
    );


    // ==================================================
    // JUGADORES DESDE SUPABASE
    // ==================================================

    jugadoresActuales.forEach(
        function(jugador) {

            const nombre =
                jugador.nombre;


            const fila =
                document.createElement(
                    "tr"
                );


            let html = `

                <td class="jugador-col">
                    ${nombre}
                </td>

            `;


            let cargaTotal = 0;


            // --------------------------------------
            // CADA DÍA CON RPE
            // --------------------------------------

            fechasConRPE.forEach(
                function(fecha) {

                    const fechaClave =
                        claveFecha(
                            fecha
                        );


                    const clave =
                        nombre +
                        "|" +
                        fechaClave;


                    const registro =
                        registros[clave];


                    const respuestas =
                        registro
                            ? (
                                registro.respuestas ||
                                {}
                            )
                            : {};


                    const rpe =
                        respuestas.rpe ??
                        "";


                    // --------------------------------
                    // MINUTOS
                    // --------------------------------

                    let minutos;


                    if (

                        respuestas.minutos !==
                            undefined &&

                        respuestas.minutos !==
                            null &&

                        respuestas.minutos !==
                            ""

                    ) {

                        minutos =
                            Number(
                                respuestas.minutos
                            );

                    } else {

                        minutos =
                            75;

                    }


                    // --------------------------------
                    // CARGA
                    // --------------------------------

                    const carga =

                        Number(rpe) > 0 &&
                        Number(minutos) > 0

                            ? Number(rpe) *
                              Number(minutos)

                            : 0;


                    // --------------------------------
                    // MEDIA RPE
                    // --------------------------------

                    if (

                        Number(rpe) >= 1 &&

                        Number(rpe) <= 10

                    ) {

                        medias[
                            fechaClave
                        ].suma +=
                            Number(rpe);


                        medias[
                            fechaClave
                        ].cantidad++;

                    }


                    // --------------------------------
                    // CARGA TOTAL
                    // --------------------------------

                    cargaTotal +=
                        carga;


                    // --------------------------------
                    // HTML
                    // --------------------------------

                    html += `

                        <td class="celda-rpe">

                            <input
                                class="input-rpe"
                                type="number"
                                min="1"
                                max="10"
                                value="${rpe}"
                                readonly
                            >

                        </td>


                        <td class="celda-min">

                            <input
                                class="input-minutos"
                                type="number"
                                min="0"
                                value="${minutos}"
                                data-id="${
                                    registro
                                        ? registro.id
                                        : ""
                                }"
                                ${
                                    registro
                                        ? ""
                                        : "disabled"
                                }
                            >

                        </td>


                        <td class="celda-carga">

                            ${carga || ""}

                        </td>

                    `;

                }
            );


            // --------------------------------------
            // CARGA TOTAL
            // --------------------------------------

            html += `

                <td
                    class="
                        carga-total-col
                        carga-total
                    "
                >
                    ${cargaTotal || ""}
                </td>

            `;


            fila.innerHTML =
                html;


            tabla.appendChild(
                fila
            );

        }
    );


    // ==================================================
    // FILA MEDIA RPE
    // ==================================================

    const filaMedia =
        document.createElement(
            "tr"
        );


    filaMedia.className =
        "fila-media";


    let htmlMedia = `

        <td class="jugador-col">
            Media RPE
        </td>

    `;


    fechasConRPE.forEach(
        function(fecha) {

            const clave =
                claveFecha(
                    fecha
                );


            const datos =
                medias[clave];


            const media =

                datos.cantidad > 0

                    ? (

                        datos.suma /
                        datos.cantidad

                    ).toFixed(1)

                    : "-";


            htmlMedia += `

                <td>
                    ${media}
                </td>

                <td></td>

                <td></td>

            `;

        }
    );


    htmlMedia += `

        <td class="carga-total-col">
        </td>

    `;


    filaMedia.innerHTML =
        htmlMedia;


    pie.appendChild(
        filaMedia
    );


    // ==================================================
    // EVENTOS DE MINUTOS
    // ==================================================

    document
        .querySelectorAll(
            ".input-minutos"
        )
        .forEach(
            function(input) {

                input.addEventListener(
                    "input",
                    function() {

                        actualizarCargas();

                    }
                );


                input.addEventListener(
                    "change",
                    function() {

                        guardarMinutos(
                            this
                        );

                    }
                );

            }
        );


    // ==================================================
    // COLORES
    // ==================================================

    aplicarEscalasColores();


    mensaje.textContent =

        (data || []).length +

        " registros RPE encontrados.";

}


// ======================================================
// GUARDAR MINUTOS
// ======================================================

async function guardarMinutos(
    input
) {

    const id =
        input.dataset.id;


    if (!id) {

        return;

    }


    const minutos =

        input.value === ""

            ? null

            : Number(
                input.value
            );


    const {
        data,
        error
    } = await supabaseClient

        .from("respuestas")

        .select("respuestas")

        .eq(
            "id",
            id
        )

        .single();


    if (error) {

        console.error(error);

        return;

    }


    const respuestas =
        data.respuestas || {};


    respuestas.minutos =
        minutos;


    const resultado =
        await supabaseClient

            .from("respuestas")

            .update({

                respuestas:
                    respuestas

            })

            .eq(
                "id",
                id
            );


    if (resultado.error) {

        console.error(
            resultado.error
        );


        alert(
            "No se han podido guardar los minutos. " +
            "Comprueba la política UPDATE de Supabase."
        );

        return;

    }


    actualizarCargas();

}


// ======================================================
// COLOR DEL RPE
// ======================================================

function colorRPE(valor) {

    if (!Number.isFinite(valor)) {

        return "";

    }


    const minimo = 1;

    const maximo = 10;

    const mitad = 5.5;


    let porcentaje;

    let r;

    let g;

    let b;


    if (valor <= mitad) {

        porcentaje =

            (valor - minimo) /

            (mitad - minimo);


        r =
            Math.round(
                76 +
                (255 - 76) *
                porcentaje
            );


        g =
            Math.round(
                175 +
                (152 - 175) *
                porcentaje
            );


        b =
            Math.round(
                80 +
                (0 - 80) *
                porcentaje
            );

    } else {

        porcentaje =

            (valor - mitad) /

            (maximo - mitad);


        r =
            Math.round(
                255 +
                (244 - 255) *
                porcentaje
            );


        g =
            Math.round(
                152 +
                (67 - 152) *
                porcentaje
            );


        b =
            Math.round(
                0 +
                (54 - 0) *
                porcentaje
            );

    }


    return `rgb(${r}, ${g}, ${b})`;

}


// ======================================================
// COLOREAR RPE
// ======================================================

function colorearRPE() {

    const celdas =
        document.querySelectorAll(
            "#tablaJugadores .celda-rpe"
        );


    celdas.forEach(
        function(celda) {

            const input =
                celda.querySelector(
                    ".input-rpe"
                );


            const valor =
                Number(
                    input?.value
                );


            if (

                Number.isFinite(valor) &&

                valor >= 1 &&

                valor <= 10

            ) {

                celda.style.backgroundColor =
                    colorRPE(valor);

            }

        }
    );

}


// ======================================================
// COLOREAR CARGA TOTAL
// ======================================================

function colorearCargaTotal() {

    const celdas =
        document.querySelectorAll(
            "#tablaJugadores .carga-total"
        );


    const valores = [];


    celdas.forEach(
        function(celda) {

            const valor =
                Number(
                    celda.textContent.trim()
                );


            if (

                Number.isFinite(valor) &&

                valor >= 0

            ) {

                valores.push(valor);

            }

        }
    );


    if (valores.length === 0) {

        return;

    }


    const minimo =
        Math.min(
            ...valores
        );


    const maximo =
        Math.max(
            ...valores
        );


    celdas.forEach(
        function(celda) {

            const valor =
                Number(
                    celda.textContent.trim()
                );


            if (

                !Number.isFinite(valor) ||

                valor < 0

            ) {

                return;

            }


            if (
                maximo === minimo
            ) {

                celda.style.backgroundColor =
                    "rgb(255, 152, 0)";

                return;

            }


            const porcentaje =

                (valor - minimo) /

                (maximo - minimo);


            let r;

            let g;

            let b;


            if (
                porcentaje <= 0.5
            ) {

                const p =
                    porcentaje / 0.5;


                r =
                    Math.round(
                        76 +
                        (255 - 76) *
                        p
                    );


                g =
                    Math.round(
                        175 +
                        (152 - 175) *
                        p
                    );


                b =
                    Math.round(
                        80 +
                        (0 - 80) *
                        p
                    );

            } else {

                const p =

                    (porcentaje - 0.5) /

                    0.5;


                r =
                    Math.round(
                        255 +
                        (244 - 255) *
                        p
                    );


                g =
                    Math.round(
                        152 +
                        (67 - 152) *
                        p
                    );


                b =
                    Math.round(
                        0 +
                        (54 - 0) *
                        p
                    );

            }


            celda.style.backgroundColor =

                `rgb(${r}, ${g}, ${b})`;

        }
    );

}


// ======================================================
// APLICAR ESCALAS
// ======================================================

function aplicarEscalasColores() {

    colorearRPE();

    colorearCargaTotal();

}


// ======================================================
// ACTUALIZAR CARGAS
// ======================================================

function actualizarCargas() {

    document
        .querySelectorAll(
            "#tablaJugadores tr"
        )
        .forEach(
            function(fila) {

                const rpes =
                    fila.querySelectorAll(
                        ".input-rpe"
                    );


                const minutos =
                    fila.querySelectorAll(
                        ".input-minutos"
                    );


                const cargas =
                    fila.querySelectorAll(
                        ".celda-carga"
                    );


                const total =
                    fila.querySelector(
                        ".carga-total"
                    );


                let suma = 0;


                for (

                    let i = 0;

                    i < rpes.length;

                    i++

                ) {

                    const rpe =
                        Number(
                            rpes[i].value
                        ) || 0;


                    const min =
                        Number(
                            minutos[i].value
                        ) || 0;


                    const carga =
                        rpe * min;


                    cargas[i].textContent =
                        carga || "";


                    suma +=
                        carga;

                }


                if (total) {

                    total.textContent =
                        suma || "";

                }

            }
        );


    aplicarEscalasColores();

}
