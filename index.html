<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SD ERANDIO CLUB - Acceso</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #111 0%,
                    #222 50%,
                    #444 100%
                );

            padding: 20px;
        }


        /* ==========================================
           TARJETA PRINCIPAL
        ========================================== */

        .contenedor {

            width: 100%;
            max-width: 480px;

            background: white;

            padding: 45px 35px;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);

            animation: aparecer 0.6s ease;

        }


        /* ==========================================
           ANIMACIÓN
        ========================================== */

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ==========================================
           ESCUDO
        ========================================== */

        .escudo {

            width: 150px;
            height: 150px;

            object-fit: contain;

            margin-bottom: 15px;

            filter:
                drop-shadow(
                    0 8px 10px rgba(0, 0, 0, 0.2)
                );

        }


        /* ==========================================
           TÍTULO
        ========================================== */

        h1 {

            margin: 5px 0 8px;

            font-size: 34px;

            font-weight: 900;

            letter-spacing: 1px;

            color: #111;

        }


        .subtitulo {

            margin: 0 0 35px;

            color: #777;

            font-size: 15px;

        }


        /* ==========================================
           BOTONES
        ========================================== */

        .botones {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        button {

            width: 100%;

            padding: 18px;

            font-size: 17px;

            font-weight: bold;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;

        }


        button:hover {

            transform: translateY(-2px);

            opacity: 0.92;

        }


        button:active {

            transform: translateY(0);

        }


        /* ==========================================
           BOTÓN ENCUESTAS
        ========================================== */

        .boton-jugador {

            background: #222;

            color: white;

            box-shadow:
                0 6px 15px rgba(0, 0, 0, 0.2);

        }


        /* ==========================================
           BOTÓN ADMINISTRADOR
        ========================================== */

        .boton-administrador {

            background: #e8e8e8;

            color: #222;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.08);

        }


        /* ==========================================
           PIE
        ========================================== */

        .pie {

            margin-top: 30px;

            font-size: 12px;

            color: #aaa;

        }


        /* ==========================================
           MÓVIL
        ========================================== */

        @media (max-width: 500px) {

            .contenedor {

                padding: 35px 25px;

            }

            .escudo {

                width: 125px;
                height: 125px;

            }

            h1 {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


    <div class="contenedor">


        <!-- ==========================================
             ESCUDO
        ========================================== -->

        <img
            class="escudo"
            src="https://cdgetxo.eus/wp-content/uploads/2018/10/ErandioEscudo.png"
            alt="Escudo SD Erandio Club"
        >


        <!-- ==========================================
             TÍTULO
        ========================================== -->

        <h1>
            SD ERANDIO CLUB
        </h1>


        <p class="subtitulo">
            Área de seguimiento deportivo
        </p>


        <!-- ==========================================
             BOTONES
        ========================================== -->

        <div class="botones">


            <button
                class="boton-jugador"
                onclick="entrarJugador()">

                ⚽ ENCUESTAS

            </button>


            <button
                class="boton-administrador"
                onclick="entrarAdministrador()">

                🔐 ADMINISTRADOR

            </button>


        </div>


        <div class="pie">
            SD ERANDIO CLUB
        </div>


    </div>



    <script>


        // ==========================================
        // ENTRAR A ENCUESTAS
        // ==========================================

        function entrarJugador() {

            window.location.href =
                "panel-jugador.html";

        }



        // ==========================================
        // ENTRAR COMO ADMINISTRADOR
        // ==========================================

        function entrarAdministrador() {


            const contraseña =
                prompt(
                    "Introduce la contraseña de administrador:"
                );


            // ==========================================
            // CONTRASEÑA
            // ==========================================

            const contraseñaCorrecta =
                "erandio123";


            // ==========================================
            // COMPROBAR
            // ==========================================

            if (
                contraseña === contraseñaCorrecta
            ) {

                window.location.href =
                    "panel-admin.html";

            } else {

                alert(
                    "Contraseña incorrecta."
                );

            }

        }


    </script>


</body>

</html>
