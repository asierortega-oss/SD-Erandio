<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del personal</title>

    <link rel="stylesheet" href="estilos.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top left, #243b55 0%, transparent 35%),
                radial-gradient(circle at bottom right, #141e30 0%, transparent 40%),
                linear-gradient(135deg, #0f172a, #1e293b);
            color: #111827;
            padding: 30px 15px;
        }

        .contenedor {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        /* CABECERA */

        .cabecera {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .cabecera h1 {
            margin: 0;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .cabecera p {
            margin: 8px 0 0;
            font-size: 16px;
            color: #cbd5e1;
        }

        /* TARJETA PRINCIPAL */

        .formulario {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.30);
        }

        /* ETIQUETAS */

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }

        label:first-of-type {
            margin-top: 0;
        }

        /* SELECTS */

        select {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            color: #1e293b;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:hover {
            border-color: #94a3b8;
        }

        select:focus {
            border-color: #2563eb;
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
        }

        /* RESULTADOS */

        #resultados {
            margin-top: 30px;
        }

        #resultados h2 {
            margin: 0 0 18px;
            font-size: 22px;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
        }

        #resultados > p {
            margin: 20px 0 0;
            padding: 18px;
            text-align: center;
            border-radius: 12px;
            background: #f1f5f9;
            color: #64748b;
            font-size: 15px;
        }

        /* REGISTROS */

        .registro {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 18px 20px;
            margin-bottom: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .registro:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .registro p {
            margin: 8px 0;
            color: #475569;
            line-height: 1.5;
        }

        .registro p:first-child {
            margin-top: 0;
            padding-bottom: 10px;
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .registro p:last-child {
            margin-bottom: 0;
        }

        .registro strong {
            color: #1e293b;
        }

        /* RPE DESTACADO */

        .registro p strong {
            font-weight: 700;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .cabecera h1 {
                font-size: 28px;
            }

            .cabecera p {
                font-size: 14px;
            }

            .formulario {
                padding: 20px 16px;
                border-radius: 18px;
            }

            select {
                height: 50px;
                font-size: 15px;
            }

            .registro {
                padding: 16px;
            }

        }

    </style>
</head>

<body>

<div class="contenedor">

    <div class="cabecera">
        <h1>Panel del personal</h1>
        <p>Consulta de RPE y Wellness</p>
    </div>

    <div class="formulario">

        <label>Equipo</label>

        <select id="equipo">
            <option value="">Selecciona un equipo</option>
        </select>

        <label>Jugador</label>

        <select id="jugador">
            <option value="">Selecciona un jugador</option>
        </select>

        <label>¿Qué quieres consultar?</label>

        <select id="tipoConsulta">
            <option value="">Selecciona una opción</option>
            <option value="rpe">RPE</option>
            <option value="wellness">Wellness</option>
        </select>

        <div id="resultados"></div>

    </div>

</div>


<script>

// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
    "https://alprdcjaexllelxthhbv.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_6kF4hhGM3bwqgwv6F3zmmw__HvkPXiD";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ===============================
// CARGAR EQUIPOS
// ===============================

async function cargarEquipos() {

    const equipo =
        document.getElementById("equipo");

    equipo.innerHTML =
        '<option value="">Selecciona un equipo</option>';

    const { data, error } =
        await supabaseClient
            .from("equipos")
            .select("*")
            .order("nombre", {
                ascending: true
            });

    if (error) {

        console.error(error);

        equipo.innerHTML =
            '<option value="">Error al cargar equipos</option>';

        return;
    }

    data.forEach(function(item) {

        const opcion =
            document.createElement("option");

        opcion.value = item.id;

        opcion.textContent =
            item.nombre;

        equipo.appendChild(opcion);

    });

}


// ===============================
// CAMBIO DE EQUIPO
// ===============================

document.getElementById("equipo").addEventListener("change", async function() {

    const equipoId =
        this.value;

    const jugador =
        document.getElementById("jugador");

    jugador.innerHTML =
        '<option value="">Selecciona un jugador</option>';

    document.getElementById("tipoConsulta").value = "";

    document.getElementById("resultados").innerHTML = "";


    if (!equipoId) {
        return;
    }


    const { data, error } =
        await supabaseClient
            .from("jugadores")
            .select("*")
            .eq("equipo_id", equipoId)
            .order("nombre", {
                ascending: true
            });


    if (error) {

        console.error(error);

        jugador.innerHTML =
            '<option value="">Error al cargar jugadores</option>';

        return;
    }


    data.forEach(function(item) {

        const opcion =
            document.createElement("option");

        opcion.value =
            item.nombre;

        opcion.textContent =
            item.nombre;

        jugador.appendChild(opcion);

    });

});


// ===============================
// CAMBIO DE JUGADOR
// ===============================

document.getElementById("jugador").addEventListener("change", function() {

    document.getElementById("tipoConsulta").value = "";

    document.getElementById("resultados").innerHTML = "";

});


// ===============================
// CONSULTAR SUPABASE
// ===============================

async function consultarRegistros() {

    const equipoSelect =
        document.getElementById("equipo");

    const equipoSeleccionado =
        equipoSelect.value;

    const jugadorSeleccionado =
        document.getElementById("jugador").value;

    const tipoSeleccionado =
        document.getElementById("tipoConsulta").value;

    const resultados =
        document.getElementById("resultados");


    if (
        equipoSeleccionado === "" ||
        jugadorSeleccionado === "" ||
        tipoSeleccionado === ""
    ) {

        resultados.innerHTML = "";

        return;

    }


    // Obtenemos el nombre visible del equipo
    const equipoNombre =
        equipoSelect.options[
            equipoSelect.selectedIndex
        ].textContent;


    resultados.innerHTML =
        "<p>Cargando datos...</p>";


    const { data, error } =
        await supabaseClient
            .from("respuestas")
            .select("*")
            .eq("equipo", equipoNombre)
            .eq("jugador", jugadorSeleccionado)
            .eq("tipo", tipoSeleccionado)
            .order("fecha", {
                ascending: false
            });


    if (error) {

        console.error(error);

        resultados.innerHTML =
            "<p>Error al consultar los datos.</p>";

        return;

    }


    if (!data || data.length === 0) {

        resultados.innerHTML =
            "<p>No hay registros para este jugador.</p>";

        return;

    }


    resultados.innerHTML = "";


    // ===============================
    // RPE
    // ===============================

    if (tipoSeleccionado === "rpe") {

        resultados.innerHTML =
            "<h2>RPE</h2>";


        data.forEach(function(registro) {

            const respuestas =
                registro.respuestas || {};


            const fecha =
                new Date(registro.fecha)
                    .toLocaleString("es-ES");


            resultados.innerHTML += `

                <div class="registro">

                    <p>
                        <strong>Fecha:</strong>
                        ${fecha}
                    </p>

                    <p>
                        <strong>RPE:</strong>
                        ${respuestas.rpe ?? "-"}
                    </p>

                </div>

            `;

        });

    }


    // ===============================
    // WELLNESS
    // ===============================

    if (tipoSeleccionado === "wellness") {

        resultados.innerHTML =
            "<h2>Wellness</h2>";


        data.forEach(function(registro) {

            const respuestas =
                registro.respuestas || {};


            const fecha =
                new Date(registro.fecha)
                    .toLocaleString("es-ES");


            resultados.innerHTML += `

                <div class="registro">

                    <p>
                        <strong>Fecha:</strong>
                        ${fecha}
                    </p>

                    <p>
                        <strong>Sueño:</strong>
                        ${respuestas.sueno ?? "-"}
                    </p>

                    <p>
                        <strong>Fatiga:</strong>
                        ${respuestas.fatiga ?? "-"}
                    </p>

                    <p>
                        <strong>Estrés:</strong>
                        ${respuestas.estres ?? "-"}
                    </p>

                    <p>
                        <strong>Dolor muscular:</strong>
                        ${respuestas.dolor ?? "-"}
                    </p>

                    <p>
                        <strong>Molestias:</strong>
                        ${respuestas.molestias ?? "-"}
                    </p>

                    <p>
                        <strong>Comentario:</strong>
                        ${respuestas.comentario || "-"}
                    </p>

                </div>

            `;

        });

    }

}


// ===============================
// CAMBIO DE TIPO DE CONSULTA
// ===============================

document.getElementById("tipoConsulta").addEventListener("change", function() {

    consultarRegistros();

});


// ===============================
// INICIAR
// ===============================

cargarEquipos();

</script>

</body>
</html>
