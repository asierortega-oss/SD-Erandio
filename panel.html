<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel del personal</title>

    <link rel="stylesheet" href="estilos.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="contenedor">

    <div class="cabecera">
        <h1>Panel del personal</h1>
        <p>Consulta de RPE y Wellness</p>
    </div>

    <div class="formulario">

        <label>Equipo</label>

        <select id="equipo">
            <option value="">Selecciona un equipo</option>
        </select>

        <label>Jugador</label>

        <select id="jugador">
            <option value="">Selecciona un jugador</option>
        </select>

        <label>¿Qué quieres consultar?</label>

        <select id="tipoConsulta">
            <option value="">Selecciona una opción</option>
            <option value="rpe">RPE</option>
            <option value="wellness">Wellness</option>
        </select>

        <div id="resultados"></div>

    </div>

</div>


<script>

// ===============================
// SUPABASE
// ===============================

const SUPABASE_URL =
    "https://alprdcjaexllelxthhbv.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_6kF4hhGM3bwqgwv6Fz3mmw__HvkPXiD";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ===============================
// CARGAR EQUIPOS
// ===============================

async function cargarEquipos() {

    const equipo =
        document.getElementById("equipo");

    equipo.innerHTML =
        '<option value="">Selecciona un equipo</option>';

    const { data, error } =
        await supabaseClient
            .from("equipos")
            .select("*")
            .order("nombre", {
                ascending: true
            });

    if (error) {

        console.error(error);

        equipo.innerHTML =
            '<option value="">Error al cargar equipos</option>';

        return;
    }

    data.forEach(function(item) {

        const opcion =
            document.createElement("option");

        opcion.value = item.id;

        opcion.textContent =
            item.nombre;

        equipo.appendChild(opcion);

    });

}


// ===============================
// CAMBIO DE EQUIPO
// ===============================

document.getElementById("equipo").addEventListener("change", async function() {

    const equipoId =
        this.value;

    const jugador =
        document.getElementById("jugador");

    jugador.innerHTML =
        '<option value="">Selecciona un jugador</option>';

    document.getElementById("tipoConsulta").value = "";

    document.getElementById("resultados").innerHTML = "";


    if (!equipoId) {
        return;
    }


    const { data, error } =
        await supabaseClient
            .from("jugadores")
            .select("*")
            .eq("equipo_id", equipoId)
            .order("nombre", {
                ascending: true
            });


    if (error) {

        console.error(error);

        jugador.innerHTML =
            '<option value="">Error al cargar jugadores</option>';

        return;
    }


    data.forEach(function(item) {

        const opcion =
            document.createElement("option");

        opcion.value =
            item.nombre;

        opcion.textContent =
            item.nombre;

        jugador.appendChild(opcion);

    });

});


// ===============================
// CAMBIO DE JUGADOR
// ===============================

document.getElementById("jugador").addEventListener("change", function() {

    document.getElementById("tipoConsulta").value = "";

    document.getElementById("resultados").innerHTML = "";

});


// ===============================
// CONSULTAR SUPABASE
// ===============================

async function consultarRegistros() {

    const equipoSelect =
        document.getElementById("equipo");

    const equipoSeleccionado =
        equipoSelect.value;

    const jugadorSeleccionado =
        document.getElementById("jugador").value;

    const tipoSeleccionado =
        document.getElementById("tipoConsulta").value;

    const resultados =
        document.getElementById("resultados");


    if (
        equipoSeleccionado === "" ||
        jugadorSeleccionado === "" ||
        tipoSeleccionado === ""
    ) {

        resultados.innerHTML = "";

        return;

    }


    // Obtenemos el nombre visible del equipo
    const equipoNombre =
        equipoSelect.options[
            equipoSelect.selectedIndex
        ].textContent;


    resultados.innerHTML =
        "<p>Cargando datos...</p>";


    const { data, error } =
        await supabaseClient
            .from("respuestas")
            .select("*")
            .eq("equipo", equipoNombre)
            .eq("jugador", jugadorSeleccionado)
            .eq("tipo", tipoSeleccionado)
            .order("fecha", {
                ascending: false
            });


    if (error) {

        console.error(error);

        resultados.innerHTML =
            "<p>Error al consultar los datos.</p>";

        return;

    }


    if (!data || data.length === 0) {

        resultados.innerHTML =
            "<p>No hay registros para este jugador.</p>";

        return;

    }


    resultados.innerHTML = "";


    // ===============================
    // RPE
    // ===============================

    if (tipoSeleccionado === "rpe") {

        resultados.innerHTML =
            "<h2>RPE</h2>";


        data.forEach(function(registro) {

            const respuestas =
                registro.respuestas || {};


            const fecha =
                new Date(registro.fecha)
                    .toLocaleString("es-ES");


            resultados.innerHTML += `

                <div class="registro">

                    <p>
                        <strong>Fecha:</strong>
                        ${fecha}
                    </p>

                    <p>
                        <strong>RPE:</strong>
                        ${respuestas.rpe ?? "-"}
                    </p>

                </div>

            `;

        });

    }


    // ===============================
    // WELLNESS
    // ===============================

    if (tipoSeleccionado === "wellness") {

        resultados.innerHTML =
            "<h2>Wellness</h2>";


        data.forEach(function(registro) {

            const respuestas =
                registro.respuestas || {};


            const fecha =
                new Date(registro.fecha)
                    .toLocaleString("es-ES");


            resultados.innerHTML += `

                <div class="registro">

                    <p>
                        <strong>Fecha:</strong>
                        ${fecha}
                    </p>

                    <p>
                        <strong>Sueño:</strong>
                        ${respuestas.sueno ?? "-"}
                    </p>

                    <p>
                        <strong>Fatiga:</strong>
                        ${respuestas.fatiga ?? "-"}
                    </p>

                    <p>
                        <strong>Estrés:</strong>
                        ${respuestas.estres ?? "-"}
                    </p>

                    <p>
                        <strong>Dolor muscular:</strong>
                        ${respuestas.dolor ?? "-"}
                    </p>

                    <p>
                        <strong>Molestias:</strong>
                        ${respuestas.molestias ?? "-"}
                    </p>

                    <p>
                        <strong>Comentario:</strong>
                        ${respuestas.comentario || "-"}
                    </p>

                </div>

            `;

        });

    }

}


// ===============================
// CAMBIO DE TIPO DE CONSULTA
// ===============================

document.getElementById("tipoConsulta").addEventListener("change", function() {

    consultarRegistros();

});


// ===============================
// INICIAR
// ===============================

cargarEquipos();

</script>

</body>
</html>
