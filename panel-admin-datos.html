<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SD Erandio - Editar datos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            max-width: 600px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }

        h2 {
            margin-top: 30px;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        button {
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .boton-anadir {
            width: 100%;
        }

        .equipo {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-top: 15px;
            overflow: hidden;
        }

        .cabecera-equipo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f7f7f7;
            cursor: pointer;
        }

        .nombre-equipo {
            font-weight: bold;
            font-size: 17px;
        }

        .boton-eliminar-equipo {
            background: #ddd;
            color: #222;
            padding: 8px 10px;
            font-size: 12px;
        }

        .jugadores {
            display: none;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .jugadores.visible {
            display: block;
        }

        .jugador {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
        }

        .jugador:last-child {
            border-bottom: none;
        }

        .boton-eliminar-jugador {
            background: #ddd;
            color: #222;
            padding: 6px 9px;
            font-size: 11px;
        }

        .mensaje {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .volver {
            width: 100%;
            margin-top: 30px;
            background: #ddd;
            color: #222;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Editar datos</h1>

        <p class="descripcion">
            Gestiona los equipos y sus jugadores
        </p>

        <h2>Añadir equipo</h2>

        <input
            type="text"
            id="nombreEquipo"
            placeholder="Nombre del equipo"
        >

        <button class="boton-anadir" onclick="anadirEquipo()">
            AÑADIR EQUIPO
        </button>

        <div id="mensaje" class="mensaje"></div>

        <h2>Equipos</h2>

        <div id="listaEquipos">
            Cargando equipos...
        </div>

        <button class="volver" onclick="volverAdmin()">
            VOLVER
        </button>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://alprdcjaexllelxthhbv.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_6kF4hhGM3bwqgwv6Fz3mmw__HvkPXiD";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // Cargar equipos al abrir la página

        cargarEquipos();


        async function cargarEquipos() {

            const contenedor =
                document.getElementById("listaEquipos");

            contenedor.innerHTML = "Cargando equipos...";


            const { data, error } =
                await supabaseClient
                    .from("equipos")
                    .select("*")
                    .order("nombre", { ascending: true });


            if (error) {

                console.error(error);

                contenedor.innerHTML =
                    "Error al cargar los equipos.";

                return;
            }


            if (!data || data.length === 0) {

                contenedor.innerHTML =
                    "Todavía no hay equipos.";

                return;
            }


            contenedor.innerHTML = "";


            data.forEach(equipo => {

                const div =
                    document.createElement("div");

                div.className = "equipo";

                div.innerHTML = `

                    <div class="cabecera-equipo"
                         onclick="mostrarJugadores('${equipo.id}')">

                        <span class="nombre-equipo">
                            ${escaparHTML(equipo.nombre)}
                        </span>

                        <button
                            class="boton-eliminar-equipo"
                            onclick="event.stopPropagation(); eliminarEquipo('${equipo.id}', '${escaparHTML(equipo.nombre)}')">

                            ELIMINAR

                        </button>

                    </div>

                    <div
                        id="jugadores-${equipo.id}"
                        class="jugadores">

                        <input
                            type="text"
                            id="nuevo-${equipo.id}"
                            placeholder="Nombre del jugador">

                        <button
                            class="boton-anadir"
                            onclick="anadirJugador('${equipo.id}')">

                            AÑADIR JUGADOR

                        </button>

                        <div id="lista-${equipo.id}">
                            Cargando jugadores...
                        </div>

                    </div>

                `;

                contenedor.appendChild(div);

            });

        }


        async function mostrarJugadores(equipoId) {

            const zona =
                document.getElementById(
                    "jugadores-" + equipoId
                );


            if (zona.classList.contains("visible")) {

                zona.classList.remove("visible");

                return;
            }


            zona.classList.add("visible");


            await cargarJugadores(equipoId);

        }


        async function cargarJugadores(equipoId) {

            const lista =
                document.getElementById(
                    "lista-" + equipoId
                );


            const { data, error } =
                await supabaseClient
                    .from("jugadores")
                    .select("*")
                    .eq("equipo_id", equipoId)
                    .order("nombre", { ascending: true });


            if (error) {

                console.error(error);

                lista.innerHTML =
                    "Error al cargar los jugadores.";

                return;
            }


            if (!data || data.length === 0) {

                lista.innerHTML =
                    "<p>No hay jugadores en este equipo.</p>";

                return;
            }


            lista.innerHTML = "";


            data.forEach(jugador => {

                const div =
                    document.createElement("div");

                div.className = "jugador";


                div.innerHTML = `

                    <span>
                        ${escaparHTML(jugador.nombre)}
                    </span>

                    <button
                        class="boton-eliminar-jugador"
                        onclick="eliminarJugador('${jugador.id}')">

                        ELIMINAR

                    </button>

                `;


                lista.appendChild(div);

            });

        }


        async function anadirEquipo() {

            const input =
                document.getElementById("nombreEquipo");

            const nombre =
                input.value.trim();


            if (!nombre) {

                mostrarMensaje(
                    "Escribe el nombre del equipo."
                );

                return;
            }


            const { error } =
                await supabaseClient
                    .from("equipos")
                    .insert({
                        nombre: nombre
                    });


            if (error) {

                console.error(error);

                if (error.code === "23505") {

                    mostrarMensaje(
                        "Ese equipo ya existe."
                    );

                } else {

                    mostrarMensaje(
                        "No se ha podido añadir el equipo."
                    );

                }

                return;
            }


            input.value = "";

            mostrarMensaje(
                "Equipo añadido correctamente."
            );


            cargarEquipos();

        }


        async function anadirJugador(equipoId) {

            const input =
                document.getElementById(
                    "nuevo-" + equipoId
                );


            const nombre =
                input.value.trim();


            if (!nombre) {

                mostrarMensaje(
                    "Escribe el nombre del jugador."
                );

                return;
            }


            const { error } =
                await supabaseClient
                    .from("jugadores")
                    .insert({
                        equipo_id: equipoId,
                        nombre: nombre
                    });


            if (error) {

                console.error(error);

                mostrarMensaje(
                    "No se ha podido añadir el jugador."
                );

                return;
            }


            input.value = "";


            mostrarMensaje(
                "Jugador añadido correctamente."
            );


            cargarJugadores(equipoId);

        }


        async function eliminarJugador(jugadorId) {

            const confirmar =
                confirm(
                    "¿Seguro que quieres eliminar este jugador?"
                );


            if (!confirmar) {
                return;
            }


            const { error } =
                await supabaseClient
                    .from("jugadores")
                    .delete()
                    .eq("id", jugadorId);


            if (error) {

                console.error(error);

                mostrarMensaje(
                    "No se ha podido eliminar el jugador."
                );

                return;
            }


            mostrarMensaje(
                "Jugador eliminado correctamente."
            );


            cargarEquipos();

        }


        async function eliminarEquipo(equipoId, nombreEquipo) {

            /*
             * Primero comprobamos si tiene jugadores.
             */

            const { data, error } =
                await supabaseClient
                    .from("jugadores")
                    .select("id")
                    .eq("equipo_id", equipoId);


            if (error) {

                console.error(error);

                mostrarMensaje(
                    "No se ha podido comprobar el equipo."
                );

                return;
            }


            if (data && data.length > 0) {

                alert(
                    "No puedes eliminar \"" +
                    nombreEquipo +
                    "\" porque todavía tiene jugadores. " +
                    "Elimina primero sus jugadores."
                );

                return;
            }


            const confirmar =
                confirm(
                    "¿Seguro que quieres eliminar el equipo \"" +
                    nombreEquipo +
                    "\"?"
                );


            if (!confirmar) {
                return;
            }


            const resultado =
                await supabaseClient
                    .from("equipos")
                    .delete()
                    .eq("id", equipoId);


            if (resultado.error) {

                console.error(resultado.error);

                mostrarMensaje(
                    "No se ha podido eliminar el equipo."
                );

                return;
            }


            mostrarMensaje(
                "Equipo eliminado correctamente."
            );


            cargarEquipos();

        }


        function mostrarMensaje(texto) {

            const mensaje =
                document.getElementById("mensaje");

            mensaje.textContent = texto;


            setTimeout(() => {

                mensaje.textContent = "";

            }, 3000);

        }


        function escaparHTML(texto) {

            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function volverAdmin() {

            window.location.href =
                "panel-admin.html";

        }

    </script>

</body>

</html>
