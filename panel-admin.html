<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SD ERANDIO CLUB - Administrador</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #111 0%,
                    #222 50%,
                    #444 100%
                );

            padding: 20px;
        }


        /* ==========================================
           TARJETA PRINCIPAL
        ========================================== */

        .contenedor {

            width: 100%;
            max-width: 600px;

            background: white;

            padding: 40px 35px;

            border-radius: 24px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);

            animation: aparecer 0.6s ease;

        }


        /* ==========================================
           ANIMACIÓN
        ========================================== */

        @keyframes aparecer {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ==========================================
           CABECERA
        ========================================== */

        .escudo {

            width: 100px;
            height: 100px;

            object-fit: contain;

            margin-bottom: 10px;

            filter:
                drop-shadow(
                    0 6px 8px rgba(0, 0, 0, 0.2)
                );

        }


        h1 {

            margin: 5px 0 8px;

            font-size: 32px;

            font-weight: 900;

            letter-spacing: 1px;

            color: #111;

        }


        .subtitulo {

            color: #777;

            margin: 0 0 30px;

            font-size: 15px;

        }


        /* ==========================================
           BOTONES
        ========================================== */

        .botones {

            display: flex;

            flex-direction: column;

            gap: 14px;

        }


        button {

            width: 100%;

            padding: 17px;

            font-size: 16px;

            font-weight: bold;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;

        }


        button:hover {

            transform: translateY(-2px);

            opacity: 0.92;

        }


        button:active {

            transform: translateY(0);

        }


        /* ==========================================
           PANEL PERSONAL
        ========================================== */

        .boton-personal {

            background: #222;

            color: white;

            box-shadow:
                0 6px 15px rgba(0, 0, 0, 0.18);

        }


        /* ==========================================
           PANEL EQUIPOS
        ========================================== */

        .boton-equipos {

            background: #333;

            color: white;

            box-shadow:
                0 6px 15px rgba(0, 0, 0, 0.18);

        }


        /* ==========================================
           OPCIONES RPE / WELLNESS
        ========================================== */

        .opciones-equipos {

            display: none;

            gap: 12px;

            margin-top: -3px;

        }


        .opciones-equipos button {

            flex: 1;

            padding: 15px;

            font-size: 15px;

        }


        .boton-rpe {

            background: #555;

            color: white;

        }


        .boton-wellness {

            background: #777;

            color: white;

        }


        /* ==========================================
           EDITAR DATOS
        ========================================== */

        .boton-datos {

            background: #e8e8e8;

            color: #222;

        }


        /* ==========================================
           VOLVER
        ========================================== */

        .volver {

            margin-top: 25px;

            background: transparent;

            color: #777;

            border: 2px solid #ddd;

            padding: 12px 25px;

            width: auto;

        }


        .volver:hover {

            background: #f2f2f2;

            color: #222;

        }


        /* ==========================================
           PIE
        ========================================== */

        .pie {

            margin-top: 25px;

            font-size: 12px;

            color: #aaa;

        }


        /* ==========================================
           MÓVIL
        ========================================== */

        @media (max-width: 600px) {

            .contenedor {

                padding: 35px 25px;

            }


            .escudo {

                width: 85px;
                height: 85px;

            }


            h1 {

                font-size: 26px;

            }


            .opciones-equipos {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


    <div class="contenedor">


        <!-- ==========================================
             ESCUDO
        ========================================== -->

        <img
            class="escudo"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT67rBBvY85AFAoEa9tyytlTddXT26v1Vlbs49qZC_F4HgH9p5vbms0Wsk1&s=10"
            alt="Escudo SD Erandio Club"
        >


        <!-- ==========================================
             CABECERA
        ========================================== -->

        <h1>
            SD ERANDIO CLUB
        </h1>


        <p class="subtitulo">
            Panel de administración
        </p>


        <!-- ==========================================
             BOTONES
        ========================================== -->

        <div class="botones">


            <button
                class="boton-personal"
                onclick="abrirPanelPersonal()">

                👤 PANEL PERSONAL

            </button>


            <button
                class="boton-equipos"
                onclick="mostrarOpcionesEquipos()">

                ⚽ PANEL DE EQUIPOS

            </button>


            <!-- RPE / WELLNESS -->

            <div
                id="opcionesEquipos"
                class="opciones-equipos">


                <button
                    class="boton-rpe"
                    onclick="abrirPanelRPE()">

                    📊 RPE

                </button>


                <button
                    class="boton-wellness"
                    onclick="abrirPanelWellness()">

                    ❤️ WELLNESS

                </button>


            </div>


            <button
                class="boton-datos"
                onclick="abrirEdicionDatos()">

                ⚙️ EDITAR DATOS

            </button>


        </div>


        <!-- ==========================================
             VOLVER
        ========================================== -->

        <button
            class="volver"
            onclick="volverInicio()">

            ← VOLVER

        </button>


        <div class="pie">

            SD ERANDIO CLUB

        </div>


    </div>



    <script>


        // ==========================================
        // PANEL PERSONAL
        // ==========================================

        function abrirPanelPersonal() {

            window.location.href =
                "panel.html";

        }



        // ==========================================
        // MOSTRAR RPE / WELLNESS
        // ==========================================

        function mostrarOpcionesEquipos() {

            const opciones =
                document.getElementById(
                    "opcionesEquipos"
                );


            if (
                opciones.style.display === "flex"
            ) {

                opciones.style.display = "none";

            } else {

                opciones.style.display = "flex";

            }

        }



        // ==========================================
        // PANEL RPE
        // ==========================================

        function abrirPanelRPE() {

            window.location.href =
                "panel-equipos.html";

        }



        // ==========================================
        // PANEL WELLNESS
        // ==========================================

        function abrirPanelWellness() {

            window.location.href =
                "panel-wellness.html";

        }



        // ==========================================
        // EDITAR DATOS
        // ==========================================

        function abrirEdicionDatos() {

            window.location.href =
                "panel-admin-datos.html";

        }



        // ==========================================
        // VOLVER AL INICIO
        // ==========================================

        function volverInicio() {

            window.location.href =
                "index.html";

        }


    </script>


</body>

</html>
