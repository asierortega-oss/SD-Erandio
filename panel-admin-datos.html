<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SD Erandio - Editar datos</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        padding: 30px 15px;
        color: #1e293b;
    }

    .contenedor {
        width: 100%;
        max-width: 850px;
        margin: 0 auto;
        background: white;
        padding: 32px;
        border-radius: 22px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.30);
    }

    h1 {
        text-align: center;
        margin: 0;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: #0f172a;
    }

    .descripcion {
        text-align: center;
        color: #64748b;
        margin: 8px 0 30px;
        font-size: 16px;
        line-height: 1.5;
    }

    h2 {
        margin-top: 30px;
        margin-bottom: 14px;
        font-size: 21px;
        color: #0f172a;
    }

    input {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
        color: #1e293b;
        margin-bottom: 10px;
        transition: all 0.2s ease;
    }

    input:focus {
        outline: none;
        border-color: #0f172a;
        background: white;
        box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
    }

    button {
        padding: 13px 18px;
        font-size: 15px;
        font-weight: 700;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: #0f172a;
        color: white;
        transition: all 0.2s ease;
    }

    button:hover {
        background: #1e293b;
        transform: translateY(-2px);
        box-shadow: 0 7px 18px rgba(15, 23, 42, 0.18);
    }

    .boton-anadir {
        width: 100%;
        margin-top: 2px;
    }

    .equipo {
        border: 2px solid #e2e8f0;
        border-radius: 16px;
        margin-top: 15px;
        overflow: hidden;
        background: white;
        box-shadow: 0 5px 14px rgba(15, 23, 42, 0.05);
        transition: all 0.2s ease;
    }

    .equipo:hover {
        border-color: #cbd5e1;
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    .cabecera-equipo {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 17px 18px;
        background: #f8fafc;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .cabecera-equipo:hover {
        background: #f1f5f9;
    }

    .nombre-equipo {
        font-weight: 800;
        font-size: 17px;
        color: #0f172a;
    }

    .boton-eliminar-equipo {
        flex-shrink: 0;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        padding: 8px 11px;
        font-size: 12px;
        border-radius: 9px;
        box-shadow: none;
    }

    .boton-eliminar-equipo:hover {
        background: #fee2e2;
        color: #991b1b;
        box-shadow: none;
    }

    .jugadores {
        display: none;
        padding: 18px;
        border-top: 2px solid #e2e8f0;
        background: white;
    }

    .jugadores.visible {
        display: block;
    }

    .jugadores .boton-anadir {
        margin-bottom: 15px;
    }

    .jugador {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 12px 0;
        border-bottom: 1px solid #e2e8f0;
        color: #334155;
        font-size: 15px;
    }

    .jugador:last-child {
        border-bottom: none;
    }

    .jugador span {
        font-weight: 600;
    }

    .boton-eliminar-jugador {
        flex-shrink: 0;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        padding: 7px 10px;
        font-size: 11px;
        border-radius: 8px;
        box-shadow: none;
    }

    .boton-eliminar-jugador:hover {
        background: #fee2e2;
        color: #991b1b;
        box-shadow: none;
    }

    .mensaje {
        text-align: center;
        margin-top: 15px;
        padding: 13px 15px;
        border-radius: 12px;
        background: #f8fafc;
        border: 2px solid #e2e8f0;
        color: #334155;
        font-weight: 700;
    }

    .volver {
        width: 100%;
        margin-top: 30px;
        background: transparent;
        color: #334155;
        border: 2px solid #334155;
        box-shadow: none;
    }

    .volver:hover {
        background: #0f172a;
        color: white;
        border-color: #0f172a;
        box-shadow: none;
    }

    @media (max-width: 600px) {

        body {
            padding: 15px 10px;
        }

        .contenedor {
            margin: 0 auto;
            padding: 24px 18px;
            border-radius: 18px;
        }

        h1 {
            font-size: 28px;
        }

        .descripcion {
            font-size: 14px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 19px;
        }

        .cabecera-equipo {
            padding: 15px;
        }

        .nombre-equipo {
            font-size: 16px;
        }

        .jugadores {
            padding: 15px;
        }

        .jugador {
            padding: 11px 0;
        }

        .boton-eliminar-equipo {
            padding: 7px 9px;
            font-size: 11px;
        }

        .boton-eliminar-jugador {
            padding: 6px 8px;
        }
    }
</style>
    
</head>

<body>

    <div class="contenedor">

        <h1>Editar datos</h1>

        <p class="descripcion">
            Gestiona los equipos y sus jugadores
        </p>

        <h2>Añadir equipo</h2>

        <input
            type="text"
            id="nombreEquipo"
            placeholder="Nombre del equipo"
        >

        <button class="boton-anadir" onclick="anadirEquipo()">
            AÑADIR EQUIPO
        </button>

        <div id="mensaje" class="mensaje"></div>

        <h2>Equipos</h2>

        <div id="listaEquipos">
            Cargando equipos...
        </div>

        <button class="volver" onclick="volverAdmin()">
            VOLVER
        </button>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL =
            "https://alprdcjaexllelxthhbv.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_6kF4hhGM3bwqgwv6Fz3mmw__HvkPXiD";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // Cargar equipos al abrir la página

        cargarEquipos();


        async function cargarEquipos() {

            const contenedor =
                document.getElementById("listaEquipos");

            contenedor.innerHTML = "Cargando equipos...";


            const { data, error } =
                await supabaseClient
                    .from("equipos")
                    .select("*")
                    .order("nombre", { ascending: true });


            if (error) {

                console.error(error);

                contenedor.innerHTML =
                    "Error al cargar los equipos.";

                return;
            }


            if (!data || data.length === 0) {

                contenedor.innerHTML =
                    "Todavía no hay equipos.";

                return;
            }


            contenedor.innerHTML = "";


            data.forEach(equipo => {

                const div =
                    document.createElement("div");

                div.className = "equipo";

                div.innerHTML = `

                    <div class="cabecera-equipo"
                         onclick="mostrarJugadores('${equipo.id}')">

                        <span class="nombre-equipo">
                            ${escaparHTML(equipo.nombre)}
                        </span>

                        <button
                            class="boton-eliminar-equipo"
                            onclick="event.stopPropagation(); eliminarEquipo('${equipo.id}', '${escaparHTML(equipo.nombre)}')">

                            ELIMINAR

                        </button>

                    </div>

                    <div
                        id="jugadores-${equipo.id}"
                        class="jugadores">

                        <input
                            type="text"
                            id="nuevo-${equipo.id}"
                            placeholder="Nombre del jugador">

                        <button
                            class="boton-anadir"
                            onclick="anadirJugador('${equipo.id}')">

                            AÑADIR JUGADOR

                        </button>

                        <div id="lista-${equipo.id}">
                            Cargando jugadores...
                        </div>

                    </div>

                `;

                contenedor.appendChild(div);

            });

        }


        async function mostrarJugadores(equipoId) {

            const zona =
                document.getElementById(
                    "jugadores-" + equipoId
                );


            if (zona.classList.contains("visible")) {

                zona.classList.remove("visible");

                return;
            }


            zona.classList.add("visible");


            await cargarJugadores(equipoId);

        }


        async function cargarJugadores(equipoId) {

            const lista =
                document.getElementById(
                    "lista-" + equipoId
                );


            const { data, error } =
                await supabaseClient
                    .from("jugadores")
                    .select("*")
                    .eq("equipo_id", equipoId)
                    .order("nombre", { ascending: true });


            if (error) {

                console.error(error);

                lista.innerHTML =
                    "Error al cargar los jugadores.";

                return;
            }


            if (!data || data.length === 0) {

                lista.innerHTML =
                    "<p>No hay jugadores en este equipo.</p>";

                return;
            }


            lista.innerHTML = "";


            data.forEach(jugador => {

                const div =
                    document.createElement("div");

                div.className = "jugador";


                div.innerHTML = `

                    <span>
                        ${escaparHTML(jugador.nombre)}
                    </span>

                    <button
                        class="boton-eliminar-jugador"
                        onclick="eliminarJugador('${jugador.id}')">

                        ELIMINAR

                    </button>

                `;


                lista.appendChild(div);

            });

        }


        async function anadirEquipo() {

            const input =
                document.getElementById("nombreEquipo");

            const nombre =
                input.value.trim();


            if (!nombre) {

                mostrarMensaje(
                    "Escribe el nombre del equipo."
                );

                return;
            }


            const { error } =
                await supabaseClient
                    .from("equipos")
                    .insert({
                        nombre: nombre
                    });


            if (error) {

                console.error(error);

                if (error.code === "23505") {

                    mostrarMensaje(
                        "Ese equipo ya existe."
                    );

                } else {

                    mostrarMensaje(
                        "No se ha podido añadir el equipo."
                    );

                }

                return;
            }


            input.value = "";

            mostrarMensaje(
                "Equipo añadido correctamente."
            );


            cargarEquipos();

        }


        async function anadirJugador(equipoId) {

            const input =
                document.getElementById(
                    "nuevo-" + equipoId
                );


            const nombre =
                input.value.trim();


            if (!nombre) {

                mostrarMensaje(
                    "Escribe el nombre del jugador."
                );

                return;
            }


            const { error } =
                await supabaseClient
                    .from("jugadores")
                    .insert({
                        equipo_id: equipoId,
                        nombre: nombre
                    });


            if (error) {

                console.error(error);

                mostrarMensaje(
                    "No se ha podido añadir el jugador."
                );

                return;
            }


            input.value = "";


            mostrarMensaje(
                "Jugador añadido correctamente."
            );


            cargarJugadores(equipoId);

        }


        async function eliminarJugador(jugadorId) {

            const confirmar =
                confirm(
                    "¿Seguro que quieres eliminar este jugador?"
                );


            if (!confirmar) {
                return;
            }


            const { error } =
                await supabaseClient
                    .from("jugadores")
                    .delete()
                    .eq("id", jugadorId);


            if (error) {

                console.error(error);

                mostrarMensaje(
                    "No se ha podido eliminar el jugador."
                );

                return;
            }


            mostrarMensaje(
                "Jugador eliminado correctamente."
            );


            cargarEquipos();

        }


        async function eliminarEquipo(equipoId, nombreEquipo) {

            /*
             * Primero comprobamos si tiene jugadores.
             */

            const { data, error } =
                await supabaseClient
                    .from("jugadores")
                    .select("id")
                    .eq("equipo_id", equipoId);


            if (error) {

                console.error(error);

                mostrarMensaje(
                    "No se ha podido comprobar el equipo."
                );

                return;
            }


            if (data && data.length > 0) {

                alert(
                    "No puedes eliminar \"" +
                    nombreEquipo +
                    "\" porque todavía tiene jugadores. " +
                    "Elimina primero sus jugadores."
                );

                return;
            }


            const confirmar =
                confirm(
                    "¿Seguro que quieres eliminar el equipo \"" +
                    nombreEquipo +
                    "\"?"
                );


            if (!confirmar) {
                return;
            }


            const resultado =
                await supabaseClient
                    .from("equipos")
                    .delete()
                    .eq("id", equipoId);


            if (resultado.error) {

                console.error(resultado.error);

                mostrarMensaje(
                    "No se ha podido eliminar el equipo."
                );

                return;
            }


            mostrarMensaje(
                "Equipo eliminado correctamente."
            );


            cargarEquipos();

        }


        function mostrarMensaje(texto) {

            const mensaje =
                document.getElementById("mensaje");

            mensaje.textContent = texto;


            setTimeout(() => {

                mensaje.textContent = "";

            }, 3000);

        }


        function escaparHTML(texto) {

            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        function volverAdmin() {

            window.location.href =
                "panel-admin.html";

        }

    </script>

</body>

</html>
